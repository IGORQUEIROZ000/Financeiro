/* ======================================================================
   MOTOR: CALENDÁRIO FINANCEIRO (Fase 6 — V2)
   Não cria nenhum registro novo — apenas lê e organiza por data os
   lançamentos que já existem (entradas, despesas, dívidas, cartões, metas),
   reaproveitando cartaoFaturaAtual/cartaoProximoVencimento (Fase 4) e os
   campos de data já existentes em cada módulo. Nenhuma data é inventada:
   um evento só aparece se o lançamento correspondente já possui aquela data.
====================================================================== */

const CAL_TIPO_INFO = {
  ENTRADA: {emoji:'↓', cor:'var(--green)', label:'Entrada', sinal:1},
  DESPESA: {emoji:'↑', cor:'var(--red)', label:'Despesa', sinal:-1},
  DIVIDA:  {emoji:'⚠', cor:'var(--orange)', label:'Dívida', sinal:-1},
  CARTAO:  {emoji:'▭', cor:'var(--purple)', label:'Cartão', sinal:-1},
  META:    {emoji:'●', cor:'var(--accent)', label:'Meta', sinal:0},
};

function addMonthsToKey(mk, n){ return monthKey(addMonths(mk+'-01', n)); }

// Todos os eventos financeiros com data conhecida dentro de um mês (chave "YYYY-MM").
function eventosDoMes(mk){
  const eventos = [];

  DB.entradas.forEach(e=>{
    if(monthKey(e.data)===mk){
      eventos.push({data:e.data, tipo:'ENTRADA', descricao:e.descricao||e.fonte||'Entrada', valor:parseNum(e.valorLiquido), status:e.recebido?'Recebido':'Previsto', origem:'entradas', id:e.id});
    }
  });

  DB.despesas.forEach(d=>{
    // usa o vencimento quando existe (mesmo critério já usado pela Central de Alertas); sem vencimento, usa a data de lançamento
    const dataEvento = d.vencimento || d.data;
    if(dataEvento && monthKey(dataEvento)===mk){
      eventos.push({data:dataEvento, tipo:'DESPESA', descricao:d.descricao||'Despesa', valor:parseNum(d.parcelado?d.valorParcela:d.valor), status:d.status||'Pendente', origem:'despesas', id:d.id});
    }
  });

  DB.dividas.forEach(d=>{
    if(d.vencimento && monthKey(d.vencimento)===mk){
      eventos.push({data:d.vencimento, tipo:'DIVIDA', descricao:`Parcela — ${d.credor||'Dívida sem nome'}`, valor:parseNum(d.valorParcela), status:d.atrasada?'Atrasada':'Prevista', origem:'dividas', id:d.id});
    }
  });

  // Cartões: projeta TODAS as parcelas futuras (ainda não pagas) de cada cartão, mês a mês,
  // reaproveitando exclusivamente compraCartaoInfo().mesesParcelas (nenhum cálculo de parcelamento
  // novo é feito aqui — só agregação). A data de cada evento usa o dia de vencimento cadastrado no
  // cartão, respeitando o último dia válido do mês; sem dia cadastrado, não inventamos data.
  DB.cartoes.forEach(c=>{
    const porMes = cartaoFaturasFuturasPorMes(c.id);
    const doMes = porMes[mk];
    if(doMes && doMes.valor>0){
      const dia = parseInt(c.vencimento);
      const dataEvento = dataVencimentoNoMes(dia, mk) || (mk+'-01');
      const atrasada = doMes.itens.some(i=>i.situacao==='Atrasada');
      const descParcelas = doMes.itens.map(i=>i.label).join(', ');
      eventos.push({data:dataEvento, tipo:'CARTAO', descricao:`Fatura — ${c.nome} (parcela ${descParcelas})`, valor:doMes.valor, status:atrasada?'Atrasada':'Prevista', origem:'cartoes', id:c.id});
    }
  });

  // Metas: só entra no calendário quando a própria meta tem prazo — nunca se inventa uma data.
  DB.metas.forEach(m=>{
    if(m.prazo && monthKey(m.prazo)===mk){
      eventos.push({data:m.prazo, tipo:'META', descricao:`Prazo da meta — ${m.descricao}`, valor:Math.max(0,parseNum(m.valorAlvo)-parseNum(m.valorAtual)), status:'Prazo', origem:'metas', id:m.id});
    }
  });

  eventos.sort((a,b)=> a.data.localeCompare(b.data));
  return eventos;
}

function eventosDoDia(mk, diaISO){
  return eventosDoMes(mk).filter(e=>e.data===diaISO);
}

// Resumo do mês — SALDO PROJETADO (eventos previstos com data no mês), nunca misturado com saldo já realizado.
function resumoMesCalendario(mk){
  const eventos = eventosDoMes(mk);
  let entradasPrevistas=0, saidasPrevistas=0;
  eventos.forEach(e=>{
    const info = CAL_TIPO_INFO[e.tipo];
    if(info.sinal>0) entradasPrevistas += e.valor;
    else if(info.sinal<0) saidasPrevistas += e.valor;
  });
  const compromissos = eventos.filter(e=>CAL_TIPO_INFO[e.tipo].sinal<0);
  const maior = compromissos.slice().sort((a,b)=>b.valor-a.valor)[0] || null;
  return {eventos, entradasPrevistas, saidasPrevistas, saldoProjetado: round2(entradasPrevistas-saidasPrevistas), qtd:eventos.length, maior};
}

// Próximo compromisso financeiro (independe do mês em navegação — busca direto nos dados, sem recalcular nada novo).
function proximoCompromissoGlobal(){
  const hoje = todayISO();
  const candidatos = [];
  DB.despesas.forEach(d=>{
    const dt = d.vencimento || d.data;
    if(dt && dt>=hoje && d.status!=='Pago') candidatos.push({data:dt, tipo:'DESPESA', descricao:d.descricao||'Despesa', valor:parseNum(d.parcelado?d.valorParcela:d.valor)});
  });
  DB.dividas.forEach(d=>{
    if(d.vencimento && d.vencimento>=hoje) candidatos.push({data:d.vencimento, tipo:'DIVIDA', descricao:`Parcela — ${d.credor||'Dívida sem nome'}`, valor:parseNum(d.valorParcela)});
  });
  DB.cartoes.forEach(c=>{
    const prox = cartaoProximoVencimento(c);
    const fatura = cartaoFaturaAtual(c.id);
    if(prox && fatura>0) candidatos.push({data:prox, tipo:'CARTAO', descricao:`Fatura — ${c.nome}`, valor:fatura});
  });
  candidatos.sort((a,b)=>a.data.localeCompare(b.data));
  return candidatos[0]||null;
}

/* ======================================================================
   MÓDULO: CALENDÁRIO FINANCEIRO (Fase 6 — V2)
====================================================================== */
let CAL_MES = thisMonthKey();
let CAL_DIA_SELECIONADO = null;

function calMudarMes(delta){ CAL_MES = addMonthsToKey(CAL_MES, delta); CAL_DIA_SELECIONADO=null; render(); }
function calIrParaHoje(){ CAL_MES = thisMonthKey(); CAL_DIA_SELECIONADO = todayISO(); render(); }
function calSelecionarDia(iso){ CAL_DIA_SELECIONADO = (CAL_DIA_SELECIONADO===iso)?null:iso; render(); }

const CAL_NOMES_MES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CAL_DOW = ['D','S','T','Q','Q','S','S'];

function calEventoLinha(e){
  const info = CAL_TIPO_INFO[e.tipo];
  const sinal = info.sinal>0?'+':(info.sinal<0?'−':'');
  return `<div class="cal-evt">
    <div style="display:flex;align-items:center;min-width:0;">
      <span class="tagdot" style="background:${info.cor};"></span>
      <div style="min-width:0;"><b style="display:block;font-size:12.5px;">${esc(e.descricao)}</b><span style="font-size:11px;color:var(--text-faint);">${info.label} · ${e.status} · ${fmtDate(e.data)}</span></div>
    </div>
    ${e.valor>0?`<span class="mono" style="color:${info.cor};white-space:nowrap;margin-left:8px;">${sinal} ${BRL(e.valor)}</span>`:''}
  </div>`;
}

function renderCalendario(main){
  pageHeader(main, 'Calendário Financeiro', 'Quando seu dinheiro entra e quando seus compromissos vencem — a partir dos dados já cadastrados nos outros módulos.');

  const [anoStr, mesStr] = CAL_MES.split('-');
  const ano = parseInt(anoStr), mesIdx = parseInt(mesStr)-1; // mesIdx 0-based
  const resumo = resumoMesCalendario(CAL_MES);

  // ---- navegação de mês ----
  const nav = document.createElement('div'); nav.className='section';
  nav.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:8px;';
  nav.innerHTML = `<button class="btn btn-sm btn-ghost" id="calPrev">‹ Anterior</button>
    <h3 style="font-size:15px;">${CAL_NOMES_MES[mesIdx]} de ${ano}</h3>
    <div style="display:flex;gap:6px;"><button class="btn btn-sm btn-ghost" id="calHoje">Hoje</button><button class="btn btn-sm btn-ghost" id="calNext">Próximo ›</button></div>`;
  main.appendChild(nav);
  nav.querySelector('#calPrev').onclick = ()=>calMudarMes(-1);
  nav.querySelector('#calNext').onclick = ()=>calMudarMes(1);
  nav.querySelector('#calHoje').onclick = ()=>calIrParaHoje();

  const bfAlertas = document.createElement('div'); bfAlertas.className='section';
  bfAlertas.innerHTML = dashLinkBtn('Ver Central de Alertas','alertas');
  main.appendChild(bfAlertas); wireDashNavButtons(bfAlertas);

  // ---- resumo do mês (SALDO PROJETADO, nunca misturado com saldo já realizado) ----
  const gRes = document.createElement('div'); gRes.className='grid grid-4 section';
  gRes.innerHTML = kpiCard('Entradas previstas', BRL(resumo.entradasPrevistas)) +
    kpiCard('Saídas previstas', BRL(resumo.saidasPrevistas), resumo.saidasPrevistas>0?'neg':'') +
    kpiCard('Saldo projetado do mês', BRL(resumo.saldoProjetado), resumo.saldoProjetado>=0?'pos':'neg') +
    kpiCard('Compromissos no mês', resumo.qtd);
  main.appendChild(gRes);
  if(resumo.maior){
    const cMaior = document.createElement('div'); cMaior.className='section';
    cMaior.innerHTML = dashEmptyCard(`Maior compromisso do mês: <b>${esc(resumo.maior.descricao)}</b> — ${BRL(resumo.maior.valor)} em ${fmtDate(resumo.maior.data)}.`);
    main.appendChild(cMaior);
  }

  // ---- próximo compromisso (independe do mês em navegação) ----
  const proximo = proximoCompromissoGlobal();
  if(proximo){
    const infoP = CAL_TIPO_INFO[proximo.tipo];
    const cProx = document.createElement('div'); cProx.className='card section';
    cProx.innerHTML = `<p style="font-size:12px;color:var(--text-faint);margin-bottom:4px;">Próximo compromisso</p>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b style="font-size:13.5px;">${fmtDate(proximo.data)} · ${esc(proximo.descricao)}</b>
        <span class="mono" style="color:${infoP.cor};">${BRL(proximo.valor)}</span>
      </div>`;
    main.appendChild(cProx);
  }

  // ---- grade do calendário (mobile-first) ----
  const gridWrap = document.createElement('div'); gridWrap.className='card section';
  const hoje = todayISO();
  const primeiroDiaSemana = new Date(ano, mesIdx, 1).getDay(); // 0=domingo — cálculo local, sem conversão de fuso
  const diasNoMes = new Date(ano, mesIdx+1, 0).getDate();
  let cellsHtml = CAL_DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<primeiroDiaSemana;i++) cellsHtml += `<div class="cal-day empty"></div>`;
  for(let dia=1; dia<=diasNoMes; dia++){
    const iso = `${ano}-${String(mesIdx+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const evs = eventosDoDia(CAL_MES, iso);
    const tiposUnicos = Array.from(new Set(evs.map(e=>e.tipo)));
    const dots = tiposUnicos.slice(0,4).map(t=>`<span style="background:${CAL_TIPO_INFO[t].cor};"></span>`).join('');
    const classes = ['cal-day'];
    if(iso===hoje) classes.push('today');
    if(iso===CAL_DIA_SELECIONADO) classes.push('selected');
    cellsHtml += `<div class="${classes.join(' ')}" data-dia="${iso}"><span class="num">${dia}</span><span class="dots">${dots}</span></div>`;
  }
  gridWrap.innerHTML = `<div class="cal-grid">${cellsHtml}</div>`;
  main.appendChild(gridWrap);
  gridWrap.querySelectorAll('.cal-day[data-dia]').forEach(el=>{
    el.onclick = ()=>calSelecionarDia(el.getAttribute('data-dia'));
  });

  // ---- lista de compromissos: do dia selecionado, ou do mês inteiro quando nenhum dia está selecionado ----
  const secList = document.createElement('div'); secList.className='section';
  const listaEventos = CAL_DIA_SELECIONADO ? eventosDoDia(CAL_MES, CAL_DIA_SELECIONADO) : resumo.eventos;
  secList.innerHTML = `<div class="section-head"><h2>${CAL_DIA_SELECIONADO? `Compromissos de ${fmtDate(CAL_DIA_SELECIONADO)}` : 'Todos os compromissos do mês'}</h2>${CAL_DIA_SELECIONADO?`<span class="hint" style="cursor:pointer;text-decoration:underline;" id="calLimpar">ver mês inteiro</span>`:''}</div>`;
  main.appendChild(secList);
  if(listaEventos.length===0){
    main.innerHTML += dashEmptyCard(CAL_DIA_SELECIONADO ? 'Nenhum compromisso financeiro neste dia.' : 'Nenhum compromisso financeiro neste período.');
  } else {
    const listWrap = document.createElement('div');
    listWrap.innerHTML = listaEventos.map(calEventoLinha).join('');
    main.appendChild(listWrap);
  }
  const limpar = document.getElementById('calLimpar');
  if(limpar) limpar.onclick = ()=>{ CAL_DIA_SELECIONADO=null; render(); };
}

// Média histórica de ENTRADAS BRUTAS EFETIVAMENTE RECEBIDAS (Entradas + Apps + Corretagem), usada para projeções
// coerentes com o motor de dízimo — substitui o uso isolado de rendaMediaMensal() apenas dentro do Fluxo de Caixa.
function rendaMediaBrutaTotalMensal(){
  const meses = new Set();
  DB.entradas.forEach(e=>{ if(e.recebido) meses.add(monthKey(e.dataRecebimento||e.data)); });
  DB.apps.forEach(a=>{ if(a.data) meses.add(monthKey(a.data)); });
  DB.corretagem.forEach(c=>{ if(parseNum(c.valorRecebido)>0) meses.add(monthKey(c.dataRecebimento||c.data)); });
  if(meses.size===0) return 0;
  let total=0;
  meses.forEach(mk=>{ total += totalEntradasBrutasRecebidasMes(mk); });
  return total/meses.size;
}

// Projeção de fluxo de caixa (13 meses: mês atual "Realizado" + 12 meses "Projetado").
// Extraída como função isolada para ser reutilizada pela Central de Alertas (Fase 1) sem duplicar a lógica financeira.
function calcularFluxoProjetado(){
  const saldoInicial = parseNum(DB.config.saldoAtual);
  let saldoAcumulado = saldoInicial;
  const linhas = [];
  const mediaBruta = rendaMediaBrutaTotalMensal();
  for(let i=0;i<=12;i++){
    const mk = addMonths(thisMonthKey()+'-01', i).slice(0,7);
    const realizado = i===0;
    // BRUTO -> DÍZIMO -> DISPONÍVEL (mês atual usa dados reais; meses futuros usam projeção coerente com Apps/Corretagem/Entradas)
    const bruto = realizado ? totalEntradasBrutasRecebidasMes(mk) : mediaBruta;
    const dizimo = realizado ? dizimoDoMes(mk) : round2(bruto * (dizimoPercentualAtivo()/100));
    const disponivel = round2(bruto - dizimo);
    const saidas = realizado ? valorComprometidoMes() : (despesasFixasMes()+despesasVariaveisMes()+ dividasParcelasProjetadas(i) + cartoesParcelasProjetadas(i) + parcelamentosProjetados(i));
    saldoAcumulado += (disponivel - saidas);
    linhas.push({mes:mk, bruto, dizimo, disponivel, saidas, saldo:saldoAcumulado, realizado});
  }
  return linhas;
}

function renderFluxo(main){
  pageHeader(main, 'Fluxo de Caixa', 'Projeção do seu saldo ao longo dos próximos meses, com base nos dados cadastrados.');

  if(!parseNum(DB.config.saldoAtual) && DB.entradas.length===0){
    main.innerHTML += `<div class="missing-data">⚠️ Configure seu "Saldo atual" em Configurações para uma projeção mais precisa.</div>`;
  }

  const linhas = calcularFluxoProjetado();

  [0,1,3,6].forEach(h=>{

    g.innerHTML += kpiCard(h===0?'Saldo projetado (este mês)':`Saldo projetado (+${h} meses)`, BRL(l.saldo), l.saldo<0?'neg':'pos');
  });

  const negativo = linhas.find(l=>l.saldo<0);

    alerta.innerHTML = `🚨 Seu saldo projetado ficará negativo em aproximadamente ${idx===0?'menos de 1 mês':`${idx} mês(es)`}, atingindo ${BRL(negativo.saldo)}.`;
    main.appendChild(alerta);
  }

  const wrap = document.createElement('div'); wrap.className='table-wrap section';
  wrap.innerHTML = `<table><thead><tr><th>Mês</th><th>Status</th><th>Entradas brutas</th><th>Dízimo</th><th>Disponível</th><th>Saídas</th><th>Saldo projetado</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td>${l.mes}</td><td><span class="status-pill ${l.realizado?'st-green':'st-purple'}">${l.realizado?'Realizado':'Projetado'}</span></td>
    <td class="mono pos">${BRL(l.bruto)}</td><td class="mono">${BRL(l.dizimo)}</td><td class="mono">${BRL(l.disponivel)}</td>

  </tbody></table>`;
  main.appendChild(wrap);
  const note = document.createElement('p'); note.style.cssText='font-size:11.5px;color:var(--text-faint);margin-top:10px;';
  note.textContent = 'O mês atual usa dados efetivamente registrados (Realizado). Os meses seguintes são estimativas (Projetado), calculadas com base na média histórica de entradas brutas recebidas (Entradas + Apps + Corretagem) e nos compromissos fixos, de cartão e de dívidas com parcelas futuras. O dízimo projetado é apenas uma estimativa — não é registrado como pago.';
  main.appendChild(note);
}
function dividasParcelasProjetadas(mesesAFrente){
  return DB.dividas.reduce((s,d)=>{
    const restantes = Math.max(0,(parseInt(d.qtdParcelas)||0)-(parseInt(d.parcelasPagas)||0));
    return s + (mesesAFrente < restantes ? parseNum(d.valorParcela) : 0);
  },0);
}
function cartoesParcelasProjetadas(mesesAFrente){
  return DB.comprasCartao.reduce((s,c)=>{
    const info = compraCartaoInfo(c);
    const restantesNoFuturo = Math.max(0, info.parcelasRestantes - mesesAFrente);
    return s + (restantesNoFuturo>0 ? info.valorParcela : 0);
  },0);
}
function parcelamentosProjetados(mesesAFrente){
  return DB.despesas.filter(d=>d.parcelado).reduce((s,d)=>{
    const info = despesaParcelaInfo(d);
    const restantesNoFuturo = Math.max(0, info.parcelasRestantes - mesesAFrente);
    return s + (restantesNoFuturo>0 ? info.valorParcela : 0);
  },0);
}

/* ======================================================================
   MÓDULO: CONSULTOR FINANCEIRO 2.0 (Fase 7 — V2)
   Camada de INTERPRETAÇÃO sobre os motores já existentes (statusFinanceiro,
   gerarAlertas, dividasComScore, cartaoPctUso, metaStatus, proximoCompromissoGlobal).
   Não recalcula nada que já exista e não inventa nenhum dado: quando falta
   informação para concluir algo, o Consultor diz isso em vez de supor.
====================================================================== */
function gerarTextoSituacao(comp){
  if(comp===0 && rendaMediaMensal()===0) return 'Cadastre suas receitas e despesas para que o consultor possa gerar um diagnóstico confiável.';
  if(comp<50) return `Seu comprometimento financeiro atual está em ${pct(comp)}, um nível saudável. Continue mantendo o controle e considere fortalecer sua reserva financeira.`;
  if(comp<70) return `Seu comprometimento financeiro atual está em ${pct(comp)}. Ainda é administrável, mas merece atenção antes que suba mais.`;
  if(comp<90) return `Seu comprometimento financeiro atual está em ${pct(comp)}, um nível elevado. Grande parte da sua renda está presa a compromissos fixos e dívidas.`;
  return `Seu comprometimento financeiro atual está em ${pct(comp)} e seu fluxo de caixa apresenta risco real de insuficiência. É hora de agir com prioridade máxima sobre as dívidas de maior impacto.`;
}

// Painel curto por área — cada linha reaproveita o motor já existente daquela área
// (Dívidas: dividasComScore/dividaAcaoRecomendada · Cartões: cartaoPctUso · Metas: metaStatus · Calendário: proximoCompromissoGlobal).
function consultorPanoramaAreas(){
  const areas = [];

  if(DB.dividas.length===0){
    areas.push({icone:'💳', area:'Dívidas', texto:'Você ainda não possui dívidas cadastradas.'});
  } else {
    const top = dividasComScore()[0];
    areas.push({icone:'💳', area:'Dívidas', texto:`Prioridade: ${esc(top.credor)||'sem nome'} — ${top.nivel.label}. ${dividaAcaoRecomendada(top, top.score)}`});
  }

  if(DB.cartoes.length===0){
    areas.push({icone:'💠', area:'Cartões', texto:'Nenhum cartão cadastrado.'});
  } else {
    const comLimite = DB.cartoes.filter(c=>cartaoPctUso(c)!==null);
    const maisUsado = comLimite.slice().sort((a,b)=>cartaoPctUso(b)-cartaoPctUso(a))[0];
    areas.push({icone:'💠', area:'Cartões', texto: maisUsado
      ? `${esc(maisUsado.nome)} está com ${pct(cartaoPctUso(maisUsado))} do limite comprometido.`
      : 'Cadastre o limite dos seus cartões para o Consultor acompanhar a utilização.'});
  }

  if(DB.metas.length===0){
    areas.push({icone:'🎯', area:'Metas', texto:'Não há informações suficientes para avaliar suas metas — nenhuma cadastrada.'});
  } else {
    const comStatus = DB.metas.map(m=>({m, st:metaStatus(m)}));
    const critica = comStatus.find(x=>x.st.status==='atrasada') || comStatus.find(x=>x.st.status==='atencao');
    areas.push({icone:'🎯', area:'Metas', texto: critica
      ? `A meta "${esc(critica.m.descricao)}" está ${critica.st.label.toLowerCase()}.`
      : `Suas ${DB.metas.length} meta(s) cadastrada(s) estão dentro do ritmo esperado.`});
  }

  const prox = proximoCompromissoGlobal();
  areas.push({icone:'📅', area:'Calendário', texto: prox
    ? `Próximo compromisso: ${esc(prox.descricao)} em ${fmtDate(prox.data)} (${BRL(prox.valor)}).`
    : 'Nenhum compromisso futuro identificado no momento.'});

  return areas;
}

// Monta a análise central do Consultor reaproveitando gerarAlertas() (Fase 1), que já
// determina a gravidade/ordem (crítico > atenção > positivo, por impacto) a partir dos
// motores de cada módulo. O Consultor apenas reformata os mesmos campos (titulo, descricao,
// dadosUtilizados, acao) na estrutura SITUAÇÃO/PROBLEMA/PRIORIDADE/MOTIVO/IMPACTO/PRÓXIMO PASSO.
function gerarAnaliseConsultor(){
  if(!sistemaTemDadosParaAlertas()) return {temDados:false};

  const st = statusFinanceiro();
  const situacao = {emoji:st.emoji, label:st.label, cls:st.cls, texto:gerarTextoSituacao(comprometimentoRenda())};

  const alertas = gerarAlertas();
  const problemas = alertas.filter(a=>a.nivel==='critico' || a.nivel==='atencao');
  const positivos = alertas.filter(a=>a.nivel==='positivo');

  if(problemas.length===0){
    return {temDados:true, positiva:true, situacao, fatoresPositivos: positivos.slice(0,4)};
  }
  return {temDados:true, positiva:false, situacao, principal: problemas[0], outros: problemas.slice(1,4)};
}

function renderEstrategia(main){
  pageHeader(main, '🎯 Plano de Recuperação Financeira', 'Fases da recuperação e método de quitação de dívidas mais adequado à sua situação.');

  const fases = [
    {n:1,t:'Estabilização',desc:'Parar de aumentar as dívidas: evitar novas parcelas, controlar cartões, cortar despesas não essenciais, organizar vencimentos.', ativa: comprometimentoRenda()>50},
    {n:2,t:'Ataque às Dívidas',desc:'Priorizar dívidas conforme o score de prioridade calculado no módulo Dívidas.', ativa: DB.dividas.length>0},
    {n:3,t:'Liberação de Fluxo de Caixa',desc:'A cada dívida quitada, o valor da parcela é recalculado como dinheiro liberado no orçamento.', ativa:false},
    {n:4,t:'Reserva',desc:'Após a estabilização, iniciar a construção de uma reserva financeira de emergência.', ativa:false},
    {n:5,t:'Recuperação',desc:'Reduzir a dependência de crédito e recompor a capacidade de poupança.', ativa:false},
    {n:6,t:'Crescimento',desc:'Construção de patrimônio a partir de uma base financeira estável.', ativa:false},
  ];
  const g = document.createElement('div'); g.className='grid grid-3 section';
  fases.forEach(f=>{
    g.innerHTML += `<div class="card" style="${f.ativa?'border-color:var(--accent);':''}">
      <div class="label" style="font-size:11px;color:var(--text-faint);text-transform:uppercase;margin-bottom:6px;">Fase ${f.n}${f.ativa?' · atual':''}</div>
      <h3 style="font-size:14px;margin-bottom:6px;">${f.t}</h3><p style="font-size:12.5px;color:var(--text-dim);">${f.desc}</p></div>`;
  });
  main.appendChild(g);

  const sec = document.createElement('div'); sec.className='section';
  sec.innerHTML = `<div class="section-head"><h2>Método de quitação</h2></div>`;
  const sub = document.createElement('div'); sub.className='subtabs';
  const metodos = [
    {id:'avalanche', label:'Avalanche'},{id:'bolaneve', label:'Bola de Neve'},
    {id:'fluxo', label:'Maior impacto no fluxo'},{id:'risco', label:'Maior risco'}
  ];
  metodos.forEach(m=>{
    const b = document.createElement('button'); b.textContent=m.label; b.className = METODO_ATUAL===m.id?'active':'';
    b.onclick=()=>{METODO_ATUAL=m.id; render();};
    sub.appendChild(b);
  });
  sec.appendChild(sub);

  const dividas = DB.dividas.slice();
  let ordenadas = [];
  if(dividas.length){
    if(METODO_ATUAL==='avalanche') ordenadas = dividas.slice().sort((a,b)=>parseNum(b.juros)-parseNum(a.juros));
    else if(METODO_ATUAL==='bolaneve') ordenadas = dividas.slice().sort((a,b)=>parseNum(a.saldoDevedor)-parseNum(b.saldoDevedor));
    else if(METODO_ATUAL==='fluxo') ordenadas = dividas.slice().sort((a,b)=>parseNum(b.valorParcela)-parseNum(a.valorParcela));
    else ordenadas = dividasComScore();
  }
  const explicacoes = {
    avalanche:'Prioriza as dívidas com os maiores juros primeiro — gera a maior economia total de juros no longo prazo.',
    bolaneve:'Prioriza as dívidas com os menores saldos primeiro — gera sensação rápida de progresso e motivação.',
    fluxo:'Prioriza as dívidas com as maiores parcelas mensais — libera o maior valor possível no orçamento a cada quitação.',
    risco:'Prioriza as dívidas com maior consequência em caso de não pagamento (atraso, negativação, corte de serviço essencial).'
  };
  const expl = document.createElement('div'); expl.className='card'; expl.style.marginBottom='14px';
  expl.innerHTML = `<p style="font-size:13px;color:var(--text-dim);">${explicacoes[METODO_ATUAL]}</p>`;
  sec.appendChild(expl);

  if(ordenadas.length===0){
    sec.innerHTML += `<div class="card"><p style="color:var(--text-dim);font-size:13px;">Cadastre suas dívidas para ver a estratégia sugerida.</p></div>`;
  } else {
    const wrap = document.createElement('div'); wrap.className='table-wrap';
    wrap.innerHTML = `<table><thead><tr><th>Ordem</th><th>Credor</th><th>Saldo devedor</th><th>Parcela</th><th>Juros</th></tr></thead><tbody>
      ${ordenadas.map((d,i)=>`<tr><td class="mono">${i+1}º</td><td>${esc(d.credor)||'—'}</td><td class="mono">${BRL(parseNum(d.saldoDevedor))}</td><td class="mono">${BRL(parseNum(d.valorParcela))}</td><td class="mono">${pct(parseNum(d.juros))}</td></tr>`).join('')}
    </tbody></table>`;
    sec.appendChild(wrap);
  }
  main.appendChild(sec);

  // recomendação de método
  if(dividas.length){
    const atrasadas = dividas.filter(d=>d.atrasada || d.riscoCorteEssencial).length;
    const jurosAlto = dividas.filter(d=>parseNum(d.juros)>5).length;
    let recomendado = 'avalanche', motivo = 'seus juros médios são o principal fator de custo — priorizar por juros economiza mais dinheiro no total.';
    if(atrasadas>0){ recomendado='risco'; motivo='você possui dívidas atrasadas ou com risco de corte de serviço essencial — o risco deve ser tratado primeiro.'; }
    else if(saldoDisponivelMes()<0){ recomendado='fluxo'; motivo='seu fluxo de caixa está negativo — liberar as maiores parcelas primeiro ajuda a equilibrar o orçamento mais rápido.'; }
    else if(jurosAlto===0){ recomendado='bolaneve'; motivo='seus juros estão controlados — quitar os menores saldos primeiro gera motivação sem custo extra relevante.'; }
    const rec = document.createElement('div'); rec.className='card section';
    rec.innerHTML = `<h3 style="font-size:14px;margin-bottom:6px;">Recomendação do sistema</h3><p style="font-size:13px;color:var(--text-dim);">Com base nos seus dados, o método <b style="color:var(--text);">${({avalanche:'Avalanche',bolaneve:'Bola de Neve',fluxo:'Maior impacto no fluxo de caixa',risco:'Maior risco'})[recomendado]}</b> é o mais adequado, porque ${motivo}</p>`;
    main.appendChild(rec);
  }
}

  let SIM_TAB = renderSimulador._tab || 'compra';
  opts.forEach(o=>{
    const b=document.createElement('button'); b.textContent=o.l; b.className= SIM_TAB===o.id?'active':'';

function simCompra(main){
  const card = document.createElement('div'); card.className='card section';
  card.innerHTML = `<div class="form-grid">
    <div class="field"><label>Valor da compra (R$)</label><input id="sValor" type="text" inputmode="decimal"></div>
    <div class="field"><label>Forma de pagamento</label><select id="sForma"><option>À vista</option><option>Parcelado no cartão</option><option>Empréstimo</option></select></div>
    <div class="field"><label>Número de parcelas</label><input id="sParc" type="text" inputmode="numeric" value="1"></div>
    <div class="field"><label>Juros (% a.m., se houver)</label><input id="sJuros" type="text" inputmode="decimal" value="0"></div>
    <div class="field"><label>Categoria</label><select id="sCat">${CATEGORIAS_DESPESA.map(c=>`<option>${c}</option>`).join('')}</select></div>
  </div>
  <div class="form-actions" style="justify-content:flex-start;margin-top:14px;"><button class="btn btn-primary" id="simBtn">Simular</button></div>
  <div id="simResult" style="margin-top:16px;"></div>`;
  main.appendChild(card);
  card.querySelector('#simBtn').onclick = ()=>{
    const valor = parseNum(document.getElementById('sValor').value);
    const parcelas = Math.max(1, parseInt(document.getElementById('sParc').value)||1);
    const juros = parseNum(document.getElementById('sJuros').value);
    const valorComJuros = valor * (1 + (juros/100)*parcelas);
    const novaParcela = valorComJuros/parcelas;
    const rendaAtual = rendaMediaMensal();
    const compAtual = comprometimentoRenda();
    const compNovo = rendaAtual>0 ? ((valorComprometidoMes()+novaParcela)/rendaAtual)*100 : 0;
    let nivel, msg;
    if(compNovo<50){ nivel={e:'🟢',t:'RECOMENDADO',cls:'st-green'}; }
    else if(compNovo<70){ nivel={e:'🟡',t:'POSSÍVEL COM CUIDADO',cls:'st-yellow'}; }
    else if(compNovo<90){ nivel={e:'🟠',t:'NÃO IDEAL',cls:'st-orange'}; }
    else { nivel={e:'🔴',t:'NÃO RECOMENDADO',cls:'st-red'}; }
    msg = `Esta compra adicionaria ${BRL(novaParcela)}/mês ao seu orçamento e aumentaria seu comprometimento de ${pct(compAtual)} para ${pct(compNovo)}.`;
    if(!rendaAtual) msg = 'Não é possível simular com precisão porque não há renda cadastrada. ' + msg;
    document.getElementById('simResult').innerHTML = `<div class="big-status" style="background:${nivel.cls==='st-green'?'var(--green-bg)':nivel.cls==='st-yellow'?'var(--yellow-bg)':nivel.cls==='st-orange'?'var(--orange-bg)':'var(--red-bg)'};">
      <div class="emoji">${nivel.e}</div><div class="txt"><h3>${nivel.t}</h3><p>${msg}</p></div></div>`;
  };
}

  main.appendChild(card);
  card.querySelector('#simBtn').onclick = ()=>{

====================================================================== */
/* ======================================================================
   MOTOR: METAS INTELIGENTES (Fase 3 — V2)
   Não cria um sistema paralelo de metas: opera exclusivamente sobre o
   modelo existente (id, descricao, tipo, valorAlvo, valorAtual, prazo).
   Único campo novo, opcional e aditivo: dataCriacao — usada apenas para
   calcular ritmo em metas criadas a partir de agora. Metas antigas sem
   esse campo continuam funcionando normalmente; nunca inventamos uma
   data de início para elas (ver metaStatus, caso 'sem_dados_ritmo').
====================================================================== */

// Margens (em pontos percentuais de progresso) usadas para classificar o ritmo
// em relação ao esperado para o tempo já decorrido da meta.
const META_STATUS_MARGEM_ADIANTADA = 10; // progresso >= esperado + 10pp => Adiantada
const META_STATUS_MARGEM_ATENCAO   = 15; // progresso até 15pp abaixo do esperado ainda é "No ritmo"
const META_STATUS_MARGEM_ATRASO    = 40; // progresso até 40pp abaixo do esperado => "Atenção"; além disso => "Atrasada"
const META_DIAS_POR_MES = 30.4375;

const META_STATUS_INFO = {
  concluida:        {emoji:'🟢', label:'Concluída',  cls:'st-green'},
  adiantada:        {emoji:'🟢', label:'Adiantada',  cls:'st-green'},
  no_ritmo:         {emoji:'🟢', label:'No ritmo',   cls:'st-green'},
  atencao:          {emoji:'🟡', label:'Atenção',    cls:'st-yellow'},
  atrasada:         {emoji:'🔴', label:'Atrasada',   cls:'st-red'},
  sem_prazo:        {emoji:'⚪', label:'Sem prazo',  cls:'st-purple'},
  sem_dados:        {emoji:'⚪', label:'Sem dados suficientes', cls:'st-purple'},
  sem_dados_ritmo:  {emoji:'⚪', label:'Sem dados suficientes para o ritmo', cls:'st-purple'},
};

// Calcula o diagnóstico completo de uma meta a partir apenas dos dados reais que ela possui.
// Nunca inventa prazo, data de início ou progresso — cada campo só é calculado quando há dado que o sustente.
function metaStatus(m){
  const alvo = parseNum(m.valorAlvo);
  const atual = parseNum(m.valorAtual);
  const hoje = todayISO();

  if(alvo<=0){
    const info = META_STATUS_INFO.sem_dados;
    return Object.assign({status:'sem_dados', pctv:null, restante:null, diasRestantes:null}, info);
  }

  const pctv = Math.max(0, Math.min(100, (atual/alvo)*100)); // nunca negativo, nunca acima de 100%
  const restante = Math.max(0, round2(alvo-atual));
  const concluida = atual>=alvo;

  if(concluida){
    const info = META_STATUS_INFO.concluida;
    return Object.assign({status:'concluida', pctv:100, restante:0, diasRestantes:null}, info);
  }

  if(!m.prazo){
    const info = META_STATUS_INFO.sem_prazo;
    return Object.assign({status:'sem_prazo', pctv, restante, diasRestantes:null}, info);
  }

  const diasRestantes = daysBetween(hoje, m.prazo); // negativo se o prazo já passou

  if(diasRestantes<0){
    const info = META_STATUS_INFO.atrasada;
    return Object.assign({status:'atrasada', pctv, restante, diasRestantes, motivo:'prazo_vencido'}, info);
  }

  // Prazo válido e ainda não vencido: só é possível avaliar o RITMO se soubermos quando a meta começou.
  const diasTotais = m.dataCriacao ? daysBetween(m.dataCriacao, m.prazo) : 0;
  if(!m.dataCriacao || diasTotais<=0){
    const info = META_STATUS_INFO.sem_dados_ritmo;
    return Object.assign({status:'sem_dados_ritmo', pctv, restante, diasRestantes}, info);
  }

  const diasDecorridos = Math.max(0, daysBetween(m.dataCriacao, hoje));
  const fracaoDecorrida = Math.min(1, diasDecorridos/diasTotais);
  const esperado = fracaoDecorrida*100;
  const diff = pctv - esperado;

  let chave;
  if(diff >= META_STATUS_MARGEM_ADIANTADA) chave = 'adiantada';
  else if(diff >= -META_STATUS_MARGEM_ATENCAO) chave = 'no_ritmo';
  else if(diff >= -META_STATUS_MARGEM_ATRASO) chave = 'atencao';
  else chave = 'atrasada';

  const info = META_STATUS_INFO[chave];
  return Object.assign({status:chave, pctv, restante, diasRestantes, esperado, motivo: chave==='atrasada'?'ritmo':undefined}, info);
}

// Valor necessário por período (mês) para atingir o objetivo dentro do prazo.
// Só calcula quando há prazo válido (futuro) e valor restante > 0.
function metaValorNecessario(m, st){
  if(!m.prazo || st.restante===null || st.restante<=0) return null;
  if(st.diasRestantes===null || st.diasRestantes<0) return null; // prazo vencido — não calcular
  const mesesRestantes = st.diasRestantes/META_DIAS_POR_MES;
  if(mesesRestantes>=1){
    return {valor: round2(st.restante/mesesRestantes), label:`${BRL(round2(st.restante/mesesRestantes))}/mês`};
  }
  // prazo inferior a um mês: dividir por uma fração de mês geraria um número artificialmente alto — mostramos o total necessário no período restante
  return {valor: round2(st.restante), label: st.diasRestantes<=1 ? `${BRL(st.restante)} até o prazo` : `${BRL(st.restante)} nos próximos ${st.diasRestantes} dia(s)`};
}

function metaTempoRestanteLabel(diasRestantes){
  if(diasRestantes===null || diasRestantes===undefined) return '—';
  if(diasRestantes<0) return `Vencido há ${Math.abs(diasRestantes)} dia(s)`;
  if(diasRestantes===0) return 'Vence hoje';
  if(diasRestantes<30) return `${diasRestantes} dia(s)`;
  return `${Math.round(diasRestantes/META_DIAS_POR_MES)} mês(es)`;
}

function renderMetas(main){
  pageHeader(main, 'Metas', 'Acompanhe suas metas financeiras: quanto já conseguiu, quanto falta e qual é o seu ritmo.');
  const head = document.createElement('div'); head.className='section-head'; head.innerHTML=`<h2>Metas cadastradas</h2>`;
  const addBtn = document.createElement('button'); addBtn.className='btn btn-primary'; addBtn.textContent='+ Nova meta';
  addBtn.onclick=()=>metaForm(); head.appendChild(addBtn); main.appendChild(head);

  if(DB.metas.length===0){
    main.innerHTML += `<div class="card"><p style="color:var(--text-dim);font-size:13px;">Nenhuma meta cadastrada ainda.</p></div>`;
    return;
  }

  // resumo rápido de status (reaproveita metaStatus — nenhum cálculo novo aqui)
  const statuses = DB.metas.map(metaStatus);
  const concluidas = statuses.filter(s=>s.status==='concluida').length;
  const emAtencao = statuses.filter(s=>s.status==='atencao').length;
  const atrasadas = statuses.filter(s=>s.status==='atrasada').length;
  const gResumo = document.createElement('div'); gResumo.className='grid grid-3 section';
  gResumo.innerHTML = kpiCard('🟢 Concluídas', concluidas) + kpiCard('🟡 Em atenção', emAtencao) + kpiCard('🔴 Atrasadas', atrasadas, atrasadas?'neg':'');
  main.appendChild(gResumo);

  const g = document.createElement('div'); g.className='grid grid-2';
  DB.metas.forEach(m=>{
    const st = metaStatus(m);
    const necessario = metaValorNecessario(m, st);
    const card = document.createElement('div'); card.className='card';
    card.innerHTML = `<div class="section-head" style="margin-bottom:8px;"><h3 style="font-size:14px;">${esc(m.descricao)}</h3>
      <div class="row-actions"><button class="btn btn-sm btn-ghost" onclick="metaForm('${m.id}')">Editar</button><button class="btn btn-sm btn-danger" onclick="deleteItem('metas','${m.id}')">Excluir</button></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:12px;color:var(--text-faint);">${esc(m.tipo)||'—'}</span>
        <span class="status-pill ${st.cls}">${st.emoji} ${st.label}</span>
      </div>
      <div class="progress" style="margin-bottom:6px;"><div style="width:${st.pctv??0}%;background:var(--accent);"></div></div>
      <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:8px;">${BRL(parseNum(m.valorAtual))} de ${BRL(parseNum(m.valorAlvo))} (${st.pctv!==null?pct(st.pctv):'—'}) · restante: ${st.restante!==null?BRL(st.restante):'—'}</p>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-faint);margin-bottom:10px;">
        <span>Prazo: ${m.prazo? fmtDate(m.prazo):'Sem prazo'}${st.diasRestantes!==null?' · '+metaTempoRestanteLabel(st.diasRestantes):''}</span>
        ${necessario?`<span>Necessário: ${necessario.label}</span>`:''}

    g.appendChild(card);
  });

}

function metaForm(id){

  openModal(id?'Editar meta':'Nova meta', `
    <div class="form-grid">
      <div class="field"><label>Descrição</label><input id="fDesc" type="text" value="${esc(m.descricao)||''}"></div>
      <div class="field"><label>Tipo</label><select id="fTipo">${['Quitar dívida','Reduzir cartão','Aumentar renda','Cortar despesas','Criar reserva','Comprar algo sem dívida'].map(t=>`<option ${m.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Valor alvo (R$)</label><input id="fAlvo" type="text" inputmode="decimal" value="${m.valorAlvo??''}"></div>
      <div class="field"><label>Valor atual (R$)</label><input id="fAtual" type="text" inputmode="decimal" value="${m.valorAtual??'0'}"></div>
      <div class="field"><label>Prazo (opcional)</label><input id="fPrazo" type="date" value="${m.prazo||''}"></div>
    </div>
    <div class="form-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="saveBtn">Salvar</button></div>
  `);
  document.getElementById('saveBtn').onclick=()=>{
    const descricao = document.getElementById('fDesc').value.trim();
    const valorAlvo = parseNum(document.getElementById('fAlvo').value);
    const valorAtual = parseNum(document.getElementById('fAtual').value);
    const prazo = document.getElementById('fPrazo').value;
    if(!descricao){ toast('Descreva a meta.', true); return; }
    if(valorAlvo<=0){ toast('O valor alvo precisa ser maior que zero.', true); return; }
    if(valorAtual<0){ toast('O valor acumulado não pode ser negativo.', true); return; }
    const obj = {id:id||uid(), descricao, tipo:document.getElementById('fTipo').value, valorAlvo, valorAtual, prazo,
      dataCriacao: (id? m.dataCriacao : null) || (id? null : todayISO())};
    upsert('metas', obj); closeModal(); toast('Meta salva.'); render();
  };
}

// Mecanismo mínimo de evolução: soma um aporte ao valor já acumulado da meta,
// sem criar um histórico paralelo — apenas atualiza o campo valorAtual já existente.
function metaAporteForm(id){
  const m = DB.metas.find(x=>x.id===id);
  if(!m) return;
  openModal('Registrar aporte', `
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:10px;">Meta: <b>${esc(m.descricao)}</b> — acumulado atual: ${BRL(parseNum(m.valorAtual))}</p>
    <div class="form-grid">
      <div class="field"><label>Valor do aporte (R$)</label><input id="fAporte" type="text" inputmode="decimal" placeholder="0,00"></div>
    </div>
    <div class="form-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="saveAporte">Adicionar</button></div>
  `);
  document.getElementById('saveAporte').onclick=()=>{
    const valor = parseNum(document.getElementById('fAporte').value);
    if(valor<=0){ toast('Informe um valor de aporte maior que zero.', true); return; }
    m.valorAtual = round2(parseNum(m.valorAtual) + valor);
    upsert('metas', m); closeModal(); toast('Aporte registrado.'); render();
  };
}

function renderBackup(main){
  pageHeader(main, 'Backup', 'Exporte, importe e proteja seus dados financeiros.');
  const card = document.createElement('div'); card.className='card section';
  card.innerHTML = `<h3 style="font-size:14px;margin-bottom:10px;">Exportar backup</h3>
    <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:12px;">Gera um arquivo .json com todos os seus dados. Guarde em local seguro.</p>
    <button class="btn btn-primary" id="exportBtn">Exportar backup (.json)</button>`;
  main.appendChild(card);
  card.querySelector('#exportBtn').onclick = ()=>{
    exportJSON(DB, `bussola-financeira-backup-${todayISO()}.json`);
    toast('Backup exportado.');
  };

  const card2 = document.createElement('div'); card2.className='card section';
  card2.innerHTML = `<h3 style="font-size:14px;margin-bottom:10px;">Importar / restaurar backup</h3>
    <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:12px;">Selecione um arquivo .json exportado anteriormente por este sistema. Os dados atuais serão substituídos após confirmação.</p>
    <input type="file" id="importFile" accept="application/json,.json">`;
  main.appendChild(card2);
  card2.querySelector('#importFile').onchange = (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const parsed = JSON.parse(e.target.result);
        if(!parsed || typeof parsed !== 'object' || !('entradas' in parsed || 'despesas' in parsed || 'dividas' in parsed)){
          toast('Arquivo inválido: não parece ser um backup deste sistema.', true); return;
        }
        if(!confirmAction('Recomenda-se criar um backup dos dados atuais antes de continuar (use "Exportar backup" acima).\n\nIsso substituirá TODOS os dados atuais pelos dados do backup. Deseja continuar?')) return;
        const d = defaultDB();
        DB = Object.assign(d, parsed, {meta:Object.assign(d.meta,parsed.meta||{}), config:Object.assign(d.config,parsed.config||{})});
        if(!Array.isArray(DB.corretagem)) DB.corretagem = [];
        if(!Array.isArray(DB.apps)) DB.apps = [];
        DB.meta.versao = 2;
        saveDB(); toast('Backup restaurado com sucesso.'); navigate('dashboard');
      }catch(err){
        toast('Não foi possível ler o arquivo. Verifique se é um JSON válido.', true);
      }
    };
    reader.readAsText(file);
  };

  const card3 = document.createElement('div'); card3.className='card';
  card3.innerHTML = `<h3 style="font-size:14px;margin-bottom:8px;">Status do armazenamento local</h3>
    <p style="font-size:12.5px;color:var(--text-dim);">Registros salvos: ${DB.entradas.length} entradas · ${DB.corretagem.length} vendas de corretagem · ${DB.apps.length} registros de apps · ${DB.despesas.length} despesas · ${DB.comprasCartao.length} compras de cartão · ${DB.cartoes.length} cartões · ${DB.dividas.length} dívidas · ${DB.metas.length} metas.</p>
    <p style="font-size:12.5px;color:var(--text-dim);margin-top:6px;">Núcleo de movimentações (novo): <b>${DB.movimentacoes.length}</b> movimentações centralizadas, geradas a partir de Entradas/Apps/Corretagem. Próximo ID: <span class="mono">MOV-${String(DB.meta.proximoIdMovimentacao||1).padStart(6,'0')}</span>.</p>
    <p style="font-size:11.5px;color:var(--text-faint);margin-top:8px;">Os dados ficam apenas neste navegador/dispositivo (localStorage). Limpar os dados do navegador apaga tudo — mantenha backups regulares. Versão da estrutura de dados: v${DB.meta.versao||1}.</p>`;
  main.appendChild(card3);

  const migCard = document.createElement('div'); migCard.className='card section'; migCard.style.marginTop='18px';
  const chavesBackupSeguranca = Object.keys(localStorage).filter(k=>k.startsWith(STORAGE_KEY+'_backup_pre_v3_'));
  migCard.innerHTML = `<h3 style="font-size:14px;margin-bottom:8px;">Backup automático de segurança</h3>
    <p style="font-size:12.5px;color:var(--text-dim);">${chavesBackupSeguranca.length
      ? 'Antes de criar o núcleo de movimentações, o sistema guardou automaticamente uma cópia intocada dos seus dados anteriores neste navegador (' + chavesBackupSeguranca.length + ' cópia(s) encontrada(s)).'
      : 'Nenhuma migração estrutural foi executada neste dispositivo ainda (ou os dados já nasceram no formato atual).'}</p>
    <p style="font-size:11.5px;color:var(--text-faint);margin-top:8px;">Essa cópia automática é uma rede de segurança extra — continue exportando o backup .json regularmente pelo botão acima.</p>`;
  main.appendChild(migCard);
}
/* ======================================================================
   MÓDULO: CENTRAL DE ALERTAS (Fase 1 — V2)
   Não duplica lógica financeira: consome exclusivamente funções já existentes
   do motor de cálculo (dividaScore/dividasComScore, saudeFinanceiraScore,
   statusFinanceiro, compraCartaoInfo/cartaoLimiteUsado, calcularFluxoProjetado etc).
   Nada é armazenado — os alertas são recalculados a cada renderização, a partir
   dos dados reais existentes no sistema. Se não houver dado suficiente para
   sustentar uma conclusão, nenhum alerta é gerado.
====================================================================== */

// Config local do módulo (não altera nenhum dado do sistema)
const ALERTA_DIAS_VENCIMENTO_PROXIMO = 5;
const ALERTA_PCT_META_BEM_ENCAMINHADA = 75;
const ALERTA_PCT_COMPROMET_CARTAO_SEM_LIMITE = 0.30; // 30% da renda média mensal, para cartões sem limite cadastrado

// Existe pelo menos um registro cadastrado em algum módulo financeiro?
// Usado para não gerar diagnósticos (mesmo "positivos") quando o sistema está vazio.
function sistemaTemDadosParaAlertas(){
  return DB.entradas.length>0 || DB.rendaVariavel.length>0 || DB.despesas.length>0 || DB.moradia.length>0 ||
    DB.cartoes.length>0 || DB.comprasCartao.length>0 || DB.dividas.length>0 || DB.metas.length>0 ||
    DB.corretagem.length>0 || DB.apps.length>0;
}

function alertaObj(nivel, titulo, descricao, modulo, dadosUtilizados, acao, impacto){
  return {nivel, titulo, descricao, modulo, dadosUtilizados, acao, impacto: impacto||0};
}

// --- avalia uma única dívida e decide, no máximo, UM alerta por dívida (evita ruído) ---
function avaliarAlertaDivida(d){
  const score = dividaScore(d);
  const nivelScore = dividaNivel(score);
  const impacto = parseNum(d.saldoDevedor) || parseNum(d.valorParcela)*10;
  const nome = esc(d.credor)||'Dívida sem nome informado';

  if(d.atrasada){
    return alertaObj('critico', `Dívida em atraso: ${nome}`, dividaMotivo(d,score), 'Dívidas',
      `Situação de atraso, ${d.diasAtraso||0} dia(s), parcela ${BRL(parseNum(d.valorParcela))}/mês, score de prioridade ${score}.`,
      'Regularize ou negocie esta dívida o quanto antes — quanto mais tempo em atraso, maior o risco de negativação e de novos encargos.', impacto*2);
  }
  if(score>=65){
    return alertaObj('critico', `Dívida de prioridade máxima: ${nome}`, dividaMotivo(d,score), 'Dívidas',
      `Score de prioridade ${score} (${nivelScore.label}).`, 'Priorize a quitação ou negociação desta dívida antes das demais.', impacto);
  }
  if(d.vencimento && d.vencimento < todayISO()){
    return alertaObj('atencao', `Vencimento já passou: ${nome}`, `O vencimento cadastrado para esta dívida (${fmtDate(d.vencimento)}) já passou e ela não está marcada como atrasada.`,
      'Dívidas', `Vencimento: ${fmtDate(d.vencimento)}.`, 'Confirme se esta dívida foi paga; se não foi, atualize o cadastro marcando-a como atrasada.', impacto*0.5);
  }
  if(score>=45){
    return alertaObj('atencao', `Dívida de alta prioridade: ${nome}`, dividaMotivo(d,score), 'Dívidas',
      `Score de prioridade ${score} (${nivelScore.label}).`, 'Acompanhe de perto e planeje a quitação desta dívida.', impacto*0.5);
  }
  if(d.vencimento && daysBetween(todayISO(), d.vencimento)>=0 && daysBetween(todayISO(), d.vencimento)<=ALERTA_DIAS_VENCIMENTO_PROXIMO){
    return alertaObj('atencao', `Parcela vencendo em breve: ${nome}`, `O vencimento (${fmtDate(d.vencimento)}) está a ${daysBetween(todayISO(),d.vencimento)} dia(s).`,
      'Dívidas', `Vencimento: ${fmtDate(d.vencimento)}, parcela ${BRL(parseNum(d.valorParcela))}.`, 'Garanta saldo disponível para o pagamento na data.', impacto*0.3);
  }
  return null;
}

// --- avalia um cartão pelo percentual real de utilização (reaproveita cartaoPctUso/cartaoClassificacaoUso da Fase 4;
//     mesmos limiares já usados visualmente na tela de Cartões: >85% vermelho, >60% laranja) ---
function avaliarAlertaCartao(c){
  const nome = esc(c.nome)||'Cartão sem nome';
  const pctUso = cartaoPctUso(c);
  const usado = cartaoLimiteUsado(c.id);
  const limite = parseNum(c.limite);

  if(pctUso===null){
    // Sem limite cadastrado: não dá para medir percentual, mas um comprometimento futuro alto
    // em relação à renda ainda é um sinal real e não duplica nenhum outro alerta.
    const futuro = cartaoComprometimentoFuturo(c.id);
    const renda = rendaMediaMensal();
    if(renda>0 && futuro > renda*ALERTA_PCT_COMPROMET_CARTAO_SEM_LIMITE){
      return alertaObj('atencao', `Comprometimento futuro elevado no cartão ${nome}`,
        `As compras futuras deste cartão somam ${BRL(futuro)}, mais de ${pct(ALERTA_PCT_COMPROMET_CARTAO_SEM_LIMITE*100,0)} da sua renda média mensal — e o cartão não tem limite cadastrado para medir o percentual de uso.`,
        'Cartões', `Comprometimento futuro: ${BRL(futuro)}, renda média mensal: ${BRL(renda)}.`,
        'Cadastre o limite deste cartão para acompanhar o percentual de utilização, e evite novas compras até reduzir o comprometimento.', futuro*0.5);
    }
    return null;
  }

  if(pctUso>100){
    return alertaObj('critico', `Cartão ${nome} acima do limite`, `A utilização já ultrapassou o limite: ${pct(pctUso)} comprometido.`,
      'Cartões', `Comprometido: ${BRL(usado)} de ${BRL(limite)} de limite.`,
      'Priorize o pagamento da fatura deste cartão para regularizar a situação; evite qualquer nova compra até então.', usado);
  }
  if(pctUso>CARTAO_PCT_UTILIZACAO_MUITO_ELEVADA){
    return alertaObj('critico', `Cartão ${nome} próximo do limite`, `${pct(pctUso)} do limite já está comprometido com compras futuras.`,
      'Cartões', `Comprometimento futuro: ${BRL(usado)} de ${BRL(limite)} de limite.`,
      'Evite novas compras neste cartão e priorize o pagamento da fatura para liberar limite.', usado);
  }
  if(pctUso>CARTAO_PCT_UTILIZACAO_ELEVADA){
    return alertaObj('atencao', `Uso elevado do cartão ${nome}`, `${pct(pctUso)} do limite já está comprometido.`,
      'Cartões', `Comprometimento futuro: ${BRL(usado)} de ${BRL(limite)} de limite.`,
      'Monitore o uso deste cartão para não chegar perto do limite.', usado*0.5);
  }
  return null;
}

// --- faturas de cartão com vencimento vencido ou próximo (consolidado, no mesmo padrão de alertasDespesasVencimento) ---
function alertasCartoesFaturaVencimento(){
  const hoje = todayISO();
  const alertas = [];
  DB.cartoes.forEach(c=>{
    const fatura = cartaoFaturaAtual(c.id);
    if(fatura<=0) return; // sem fatura em aberto — nada a avisar
    const proxVenc = cartaoProximoVencimento(c);
    if(!proxVenc) return; // sem dia de vencimento cadastrado — não inventar data
    const dias = daysBetween(hoje, proxVenc);
    if(dias>=0 && dias<=ALERTA_DIAS_VENCIMENTO_PROXIMO){
      const nome = esc(c.nome)||'Cartão sem nome';
      alertas.push(alertaObj('atencao', `Fatura do cartão ${nome} vence em breve`,
        `A fatura atual de ${BRL(fatura)} vence em ${fmtDate(proxVenc)}.`,
        'Cartões', `Vencimento: ${fmtDate(proxVenc)}, fatura: ${BRL(fatura)}.`,
        'Garanta saldo disponível para o pagamento na data.', fatura*0.5));
    }
  });
  return alertas;
}


// --- avalia uma meta (reaproveita integralmente o motor metaStatus da Fase 3 — não duplica critérios) ---
function avaliarAlertaMeta(m){
  const alvo = parseNum(m.valorAlvo), atual = parseNum(m.valorAtual);
  const nome = esc(m.descricao)||'Meta sem descrição';
  const st = metaStatus(m);

  if(st.status==='concluida'){
    return alertaObj('positivo', `Meta concluída: ${nome}`, `Você atingiu ${BRL(atual)} de ${BRL(alvo)} definidos para esta meta.`,
      'Metas', `Progresso: 100%.`, 'Defina uma nova meta para manter o ritmo de evolução financeira.', alvo);
  }
  if(st.status==='atrasada'){
    const motivoTxt = st.motivo==='prazo_vencido'
      ? `O prazo (${fmtDate(m.prazo)}) já passou e a meta está em ${pct(st.pctv)} (${BRL(atual)} de ${BRL(alvo)}).`
      : `O progresso (${pct(st.pctv)}) está bem abaixo do ritmo esperado para o tempo já decorrido (esperado: ${pct(st.esperado)}).`;
    return alertaObj('critico', `Meta atrasada: ${nome}`, motivoTxt,
      'Metas', `Progresso: ${pct(st.pctv)}${m.prazo?`, prazo: ${fmtDate(m.prazo)}`:''}.`,
      'Reavalie o prazo desta meta ou reforce os aportes para retomar o ritmo.', alvo*0.5);
  }
  if(st.status==='atencao'){
    return alertaObj('atencao', `Meta abaixo do ritmo: ${nome}`, `O progresso (${pct(st.pctv)}) está abaixo do esperado (${pct(st.esperado)}) para o tempo já decorrido, mas ainda há chance razoável de recuperação.`,
      'Metas', `Progresso: ${pct(st.pctv)}, prazo: ${fmtDate(m.prazo)}.`, 'Aumente os aportes nos próximos períodos para retomar o ritmo desta meta.', alvo*0.4);
  }
  if(st.status==='adiantada' || (st.status==='sem_dados_ritmo' && st.pctv>=ALERTA_PCT_META_BEM_ENCAMINHADA)){
    return alertaObj('positivo', `Meta bem encaminhada: ${nome}`, `Você já alcançou ${pct(st.pctv)} do valor alvo (${BRL(atual)} de ${BRL(alvo)}).`,
      'Metas', `Progresso: ${pct(st.pctv)}.`, 'Continue no ritmo atual para concluir esta meta.', alvo*0.3);
  }
  return null;
}

// --- monta despesas pendentes vencidas / vencendo em breve, consolidando para não gerar ruído ---
function alertasDespesasVencimento(){
  const hoje = todayISO();
  const pendentes = DB.despesas.filter(d=>d.vencimento && d.status!=='Pago');
  const vencidas = pendentes.filter(d=>d.vencimento<hoje);
  const vencendo = pendentes.filter(d=>d.vencimento>=hoje && daysBetween(hoje,d.vencimento)<=ALERTA_DIAS_VENCIMENTO_PROXIMO);
  const alertas = [];
  if(vencidas.length){
    const total = vencidas.reduce((s,d)=>s+parseNum(d.valor),0);
    alertas.push(alertaObj('critico',
      vencidas.length===1 ? `Despesa vencida: ${esc(vencidas[0].descricao)||'sem descrição'}` : `${vencidas.length} despesas vencidas e não pagas`,
      vencidas.length===1 ? `Venceu em ${fmtDate(vencidas[0].vencimento)} e ainda está marcada como pendente.` : `Juntas somam ${BRL(total)} e já passaram da data de vencimento sem pagamento registrado.`,
      'Despesas', `${vencidas.length} despesa(s) pendente(s), total ${BRL(total)}.`,
      'Regularize o pagamento ou atualize o status caso já tenha sido pago.', total*1.5));
  }
  if(vencendo.length){
    const total = vencendo.reduce((s,d)=>s+parseNum(d.valor),0);
    alertas.push(alertaObj('atencao',
      vencendo.length===1 ? `Despesa vence em breve: ${esc(vencendo[0].descricao)||'sem descrição'}` : `${vencendo.length} despesas vencem nos próximos ${ALERTA_DIAS_VENCIMENTO_PROXIMO} dias`,
      vencendo.length===1 ? `Vence em ${fmtDate(vencendo[0].vencimento)}.` : `Juntas somam ${BRL(total)} com vencimento nos próximos ${ALERTA_DIAS_VENCIMENTO_PROXIMO} dias.`,
      'Despesas', `${vencendo.length} despesa(s) pendente(s), total ${BRL(total)}.`,
      'Garanta saldo disponível para os próximos vencimentos.', total*0.5));
  }
  return alertas;
}

// --- gera todos os alertas do sistema, a partir dos cálculos já existentes ---
function gerarAlertas(){
  if(!sistemaTemDadosParaAlertas()) return [];
  const alertas = [];

  // 1) Status financeiro geral (reaproveita statusFinanceiro() sem recalcular nada)
  const st = statusFinanceiro();
  if(st.cls==='st-red'){
    alertas.push(alertaObj('critico', st.label, st.desc, 'Visão geral', `Comprometimento da renda: ${pct(comprometimentoRenda())}.`,
      'Reveja despesas e dívidas com urgência; se necessário, busque renda adicional ou renegocie compromissos.', 1e9));
  } else if(st.cls==='st-orange' || st.cls==='st-yellow'){
    alertas.push(alertaObj('atencao', st.label, st.desc, 'Visão geral', `Comprometimento da renda: ${pct(comprometimentoRenda())}.`,
      'Monitore de perto seus gastos nas próximas semanas.', 1e9));
  } else if(st.cls==='st-green'){
    alertas.push(alertaObj('positivo', st.label, st.desc, 'Visão geral', `Comprometimento da renda: ${pct(comprometimentoRenda())}.`,
      'Continue mantendo esse equilíbrio entre entradas e compromissos.', 1e9));
  }

  // 2) Fluxo de caixa projetado (reaproveita calcularFluxoProjetado())
  const linhas = calcularFluxoProjetado();
  const negativo = linhas.find(l=>l.saldo<0);
  if(negativo){
    const idx = linhas.indexOf(negativo);
    alertas.push(alertaObj('critico', 'Fluxo de caixa projetado negativo',
      `Seu saldo projetado ficará negativo em ${idx===0?'menos de 1 mês':`aproximadamente ${idx} mês(es)`}, atingindo ${BRL(negativo.saldo)}.`,
      'Fluxo de Caixa', `Mês projetado: ${negativo.mes}, saldo: ${BRL(negativo.saldo)}.`,
      'Revise suas despesas e compromissos antes dos próximos vencimentos para evitar saldo negativo.', Math.abs(negativo.saldo)*1.2));
  }

  // 3) Saúde financeira (reaproveita saudeFinanceiraScore())
  const sf = saudeFinanceiraScore();
  if(sf.score>=75){
    alertas.push(alertaObj('positivo', `Índice de Saúde Financeira: ${sf.faixa.label}`,
      `Seu score está em ${sf.score}/100, sem fatores relevantes reduzindo o índice no momento.`,
      'Visão geral', `Score: ${sf.score}/100.`, 'Continue com os hábitos atuais de controle financeiro.', 1e8));
  }

  // 4) Dívidas (um alerta por dívida, no máximo)
  DB.dividas.forEach(d=>{ const a = avaliarAlertaDivida(d); if(a) alertas.push(a); });
  if(DB.dividas.length>0 && DB.dividas.every(d=>!d.atrasada)){
    alertas.push(alertaObj('positivo', 'Nenhuma dívida em atraso', 'Todas as suas dívidas cadastradas estão em dia.',
      'Dívidas', `${DB.dividas.length} dívida(s) cadastrada(s), nenhuma em atraso.`, 'Continue priorizando os pagamentos em dia.', 1e7));
  }

  // 5) Cartões (um alerta por cartão pelo percentual de utilização, no máximo) + vencimento de fatura (consolidado)
  DB.cartoes.forEach(c=>{ const a = avaliarAlertaCartao(c); if(a) alertas.push(a); });
  alertasCartoesFaturaVencimento().forEach(a=>alertas.push(a));
  const cartoesComLimite = DB.cartoes.filter(c=>parseNum(c.limite)>0);
  if(cartoesComLimite.length>0 && cartoesComLimite.every(c=>(cartaoPctUso(c)??0)<=CARTAO_PCT_UTILIZACAO_ELEVADA)){
    alertas.push(alertaObj('positivo', 'Cartões sob controle', 'Todos os cartões com limite cadastrado estão com utilização controlada.',
      'Cartões', `${cartoesComLimite.length} cartão(ões) com limite cadastrado, nenhum acima de ${CARTAO_PCT_UTILIZACAO_ELEVADA}% de uso.`,
      'Continue acompanhando as faturas para manter esse controle.', 1e6));
  }

  // 6) Despesas com vencimento vencido ou próximo (consolidado)
  alertasDespesasVencimento().forEach(a=>alertas.push(a));

  // 7) Metas
  DB.metas.forEach(m=>{ const a = avaliarAlertaMeta(m); if(a) alertas.push(a); });

  // Ordenação: Críticos > Atenção > Positivos; dentro de cada nível, por impacto financeiro (maior primeiro)
  const ordemNivel = {critico:0, atencao:1, positivo:2};
  alertas.sort((a,b)=> ordemNivel[a.nivel]-ordemNivel[b.nivel] || b.impacto-a.impacto);
  return alertas;
}

/* ======================================================================
   MÓDULO: SIMULADOR "E SE?" (Fase 8 — V2 — última fase)
   Não cria um motor financeiro paralelo: toda a matemática é feita pelos
   mesmos motores já existentes (comprometimentoRenda, saldoDisponivelMes,
   saudeFinanceiraScore, dividasComScore, cartoesResumoConsolidado,
   metaStatus, gerarAlertas, gerarAnaliseConsultor) — porque eles já leem
   exclusivamente a variável global DB. O truque do simulador é só esse:
   durante a simulação, DB passa a apontar para uma CÓPIA em memória
   (SIM_REAL_DB guarda o objeto real, intocado, à parte). Cancelar a
   simulação apenas devolve DB para SIM_REAL_DB — nada é reconstruído,
   então não há como sobrar resíduo da simulação nos dados reais.
====================================================================== */

// Indicadores usados na comparação — funciona tanto para o cenário real
// (chamado antes de trocar DB pela cópia) quanto para o cenário simulado
// (chamado depois), porque sempre lê a variável global DB no momento da chamada.
function simColetarIndicadores(){
  const sf = saudeFinanceiraScore();
  return {
    entradas: totalEntradasMes()+totalRendaVariavelMes(),
    despesas: valorComprometidoMes(),
    saldo: saldoDisponivelMes(),
    comprometimento: comprometimentoRenda(),
    dividas: totalDividasSaldoDevedor(),
    cartoesPct: cartoesPercentualMedioLimite(),
    saude: sf.score
  };
}

function simIniciar(){
  if(SIM_ACTIVE) return;
  SIM_BASELINE = simColetarIndicadores();   // captura o cenário real ANTES de trocar DB
  SIM_REAL_DB = DB;                          // guarda a referência real intocada
  DB = simDeepClone(DB);                     // DB passa a ser a cópia em memória
  SIM_ACTIVE = true;
  SIM_ALTERACOES = [];
  SIM_NOME_CENARIO = '';
  render();
}

// silencioso=true evita o toast (usado quando o cancelamento é automático, ex: ao trocar de aba)
function simCancelar(silencioso){
  if(!SIM_ACTIVE) return;
  DB = SIM_REAL_DB;      // restaura os dados reais — nenhuma reconstrução, é o mesmo objeto de antes
  SIM_REAL_DB = null;
  SIM_ACTIVE = false;
  SIM_ALTERACOES = [];
  SIM_BASELINE = null;
  SIM_NOME_CENARIO = '';
  if(!silencioso) toast('Simulação cancelada. Dados reais restaurados.');
  render();
}

// Aplica UMA alteração de cenário sobre a cópia em memória (DB). Nunca é chamada
// fora de uma simulação ativa. Cada alteração gera registros sintéticos, claramente
// marcados como "[Simulação]", nos mesmos formatos de dados que os módulos reais usam
// — é assim que ela reaproveita os motores de cálculo existentes sem duplicá-los.
function simAplicarAlteracao(alt){
  switch(alt.tipo){
    case 'renda':
      DB.entradas.push({
        id:uid(), data:todayISO(), descricao:'[Simulação] '+(alt.descricao||'Aumento de renda'),
        fonte:'Simulação', categoria:'Simulação', tipo:'Extraordinária',
        valorBruto:alt.valor, custos:0, valorLiquido:alt.valor,
        recebido:true, dataRecebimento:todayISO(), obs:'Gerado pelo Simulador "E Se?" — não é um dado real.'
      });
      break;
    case 'despesa_reducao':
      // Ajuste temporário do cenário — NÃO cria uma despesa negativa (isso contaminaria relatórios,
      // calendário e qualquer função que assuma que despesas são sempre positivas). O ajuste vive só
      // em DB.config._simAjusteDespesaSimulada, lido exclusivamente por valorComprometidoMes().
      DB.config._simAjusteDespesaSimulada = round2((parseNum(DB.config._simAjusteDespesaSimulada)||0) + Math.abs(alt.valor));
      break;
    case 'pagar_divida': {
      const d = DB.dividas.find(x=>x.id===alt.dividaId);
      if(d){
        const saldoAtual = parseNum(d.saldoDevedor);
        const pagamento = Math.min(Math.abs(alt.valor), saldoAtual);
        d.saldoDevedor = round2(Math.max(0, saldoAtual - pagamento));
        // Pagamento parcial reduz só o saldo devedor simulado — a parcela mensal só muda quando a
        // dívida é quitada totalmente (saldo chega a zero). Não presumimos renegociação de parcela.
        if(d.saldoDevedor<=0){
          d.saldoDevedor = 0; d.valorParcela = 0; d.parcelasRestantes = 0;
        }
      }
      break;
    }
    case 'nova_despesa': {
      // A interface só oferece o que o motor realmente modela: "Única" (afeta só o mês atual) ou
      // "Mensal fixa" (tipo FIXA já é tratado como recorrente por despesasFixasMes, sem filtro de mês).
      const tipoDesp = alt.frequencia==='Mensal fixa' ? 'FIXA' : 'EXTRAORDINÁRIA';
      DB.despesas.push({
        id:uid(), data:todayISO(), descricao:'[Simulação] '+(alt.descricao||'Nova despesa'), categoria:'Outros', subcategoria:'',
        tipo:tipoDesp, valor:alt.valor, formaPagamento:'', vencimento:'', status:'Pendente',
        parcelado:false, quantidadeParcelas:1, valorParcela:alt.valor, obs:'Gerado pelo Simulador "E Se?".'
      });
      break;
    }
    case 'nova_parcela': {
      const qtd = Math.max(1, alt.qtdParcelas||1);
      DB.despesas.push({
        id:uid(), data:todayISO(), descricao:'[Simulação] '+(alt.descricao||'Nova parcela'), categoria:'Outros', subcategoria:'',
        tipo:'FIXA', valor: round2(alt.valorParcela*qtd), formaPagamento:'', vencimento:'', status:'Pendente',
        parcelado:true, quantidadeParcelas:qtd, valorParcela:alt.valorParcela, obs:'Gerado pelo Simulador "E Se?".'
      });
      break;
    }
    case 'meta_aporte': {
      const m = DB.metas.find(x=>x.id===alt.metaId);
      if(m) m.valorAtual = round2(parseNum(m.valorAtual) + alt.valor);
      break;
    }
    case 'cartao_compra':
      DB.comprasCartao.push({
        id:uid(), cartaoId:alt.cartaoId, data:todayISO(), descricao:'[Simulação] '+(alt.descricao||'Nova compra'),
        categoria:'Outros', valorTotal:alt.valor, parcelas:Math.max(1,alt.parcelas||1), juros:0, emAtraso:false
      });
      break;
  }
}

function simAdicionarAlteracao(alt){
  if(!SIM_ACTIVE) return;
  alt.id = uid();
  SIM_ALTERACOES.push(alt);
  simAplicarAlteracao(alt);
  render();
}

// Remover uma alteração NÃO reverte manualmente o efeito dela: reconstrói a cópia do zero
// a partir dos dados reais e reaplica só as alterações restantes. Mais simples e mais seguro
// do que tentar "desfazer" cada tipo de mutação individualmente (item 14/25 do escopo).
function simRemoverAlteracao(id){
  if(!SIM_ACTIVE) return;
  SIM_ALTERACOES = SIM_ALTERACOES.filter(a=>a.id!==id);
  DB = simDeepClone(SIM_REAL_DB);
  SIM_ALTERACOES.forEach(simAplicarAlteracao);
  render();
}

function simResetarCenario(){
  if(!SIM_ACTIVE) return;
  SIM_ALTERACOES = [];
  DB = simDeepClone(SIM_REAL_DB);
  render();
  toast('Cenário reiniciado — voltou ao ponto de partida da simulação.');
}

// Formata uma linha da tabela de comparação. A diferença nunca depende só de cor:
// o texto "melhora"/"piora"/"sem alteração" é sempre exibido por escrito também.
function simLinhaComparacao(label, a, b, fmt){
  const diff = b-a;
  const eps = 0.005;
  let texto = 'sem alteração', cls = '';
  if(Math.abs(diff)>=eps){
    const melhora = arguments[4] ? diff>0 : diff<0; // arguments[4] = melhorSeMaior
    texto = melhora ? '▲ melhora' : '▼ piora';
    cls = melhora ? 'pos' : 'neg';
  }
  const sinal = diff>eps ? '+' : '';
  return `<tr><td>${esc(label)}</td><td class="mono">${fmt(a)}</td><td class="mono">${fmt(b)}</td><td class="mono ${cls}">${sinal}${fmt(diff)} <span style="font-size:11px;">(${texto})</span></td></tr>`;
}
