  pageHeader(main, '🔮 Simulador de Decisões', '"Posso fazer isso?" — simule uma compra, renda extra ou negociação antes de decidir.');

  const sub = document.createElement('div'); sub.className='subtabs';
  const opts = [{id:'compra',l:'Posso fazer esta compra?'},{id:'renda',l:'Simular renda extra / corte'},{id:'negociacao',l:'Simular negociação de dívida'}];
  let SIM_TAB = renderSimulador._tab || 'compra';
  opts.forEach(o=>{
    const b=document.createElement('button'); b.textContent=o.l; b.className= SIM_TAB===o.id?'active':'';
    b.onclick=()=>{renderSimulador._tab=o.id; render();};
    sub.appendChild(b);
  });
  main.appendChild(sub);

  if(SIM_TAB==='compra') simCompra(main);
  else if(SIM_TAB==='renda') simRenda(main);
  else simNegociacao(main);
}
function simCompra(main){
  const card = document.createElement('div'); card.className='card section';
  card.innerHTML = `<div class="form-grid">
    <div class="field"><label>Valor da compra (R$)</label><input id="sValor" type="text" inputmode="decimal"></div>
    <div class="field"><label>Forma de pagamento</label><select id="sForma"><option>À vista</option><option>Parcelado no cartão</option><option>Empréstimo</option></select></div>
    <div class="field"><label>Número de parcelas</label><input id="sParc" type="text" inputmode="numeric" value="1"></div>
    <div class="field"><label>Juros (% a.m., se houver)</label><input id="sJuros" type="text" inputmode="decimal" value="0"></div>
    <div class="field"><label>Categoria</label><select id="sCat">${CATEGORIAS_DESPESA.map(c=>`<option>${c}</option>`).join('')}</select></div>
  </div>
  <div class="form-actions" style="justify-content:flex-start;margin-top:14px;"><button class="btn btn-primary" id="simBtn">Simular</button></div>
  <div id="simResult" style="margin-top:16px;"></div>`;
  main.appendChild(card);
  card.querySelector('#simBtn').onclick = ()=>{
    const valor = parseNum(document.getElementById('sValor').value);
    const parcelas = Math.max(1, parseInt(document.getElementById('sParc').value)||1);
    const juros = parseNum(document.getElementById('sJuros').value);
    const valorComJuros = valor * (1 + (juros/100)*parcelas);
    const novaParcela = valorComJuros/parcelas;
    const rendaAtual = rendaMediaMensal();
    const compAtual = comprometimentoRenda();
    const compNovo = rendaAtual>0 ? ((valorComprometidoMes()+novaParcela)/rendaAtual)*100 : 0;
    let nivel, msg;
    if(compNovo<50){ nivel={e:'🟢',t:'RECOMENDADO',cls:'st-green'}; }
    else if(compNovo<70){ nivel={e:'🟡',t:'POSSÍVEL COM CUIDADO',cls:'st-yellow'}; }
    else if(compNovo<90){ nivel={e:'🟠',t:'NÃO IDEAL',cls:'st-orange'}; }
    else { nivel={e:'🔴',t:'NÃO RECOMENDADO',cls:'st-red'}; }
    msg = `Esta compra adicionaria ${BRL(novaParcela)}/mês ao seu orçamento e aumentaria seu comprometimento de ${pct(compAtual)} para ${pct(compNovo)}.`;
    if(!rendaAtual) msg = 'Não é possível simular com precisão porque não há renda cadastrada. ' + msg;
    document.getElementById('simResult').innerHTML = `<div class="big-status" style="background:${nivel.cls==='st-green'?'var(--green-bg)':nivel.cls==='st-yellow'?'var(--yellow-bg)':nivel.cls==='st-orange'?'var(--orange-bg)':'var(--red-bg)'};">
      <div class="emoji">${nivel.e}</div><div class="txt"><h3>${nivel.t}</h3><p>${msg}</p></div></div>`;
  };
}
function simRenda(main){
  const card = document.createElement('div'); card.className='card section';
  card.innerHTML = `<div class="form-grid">
    <div class="field"><label>Aumento de renda mensal (R$)</label><input id="sGanho" type="text" inputmode="decimal" value="0"></div>
    <div class="field"><label>Corte de despesas mensal (R$)</label><input id="sCorte" type="text" inputmode="decimal" value="0"></div>
  </div>
  <div class="form-actions" style="justify-content:flex-start;margin-top:14px;"><button class="btn btn-primary" id="simBtn">Simular</button></div>
  <div id="simResult" style="margin-top:16px;"></div>`;
  main.appendChild(card);
  card.querySelector('#simBtn').onclick = ()=>{
    const ganho = parseNum(document.getElementById('sGanho').value);
    const corte = parseNum(document.getElementById('sCorte').value);
    const delta = ganho+corte;
    const capacidadeAtual = Math.max(1, saldoDisponivelMes());
    const novaCapacidade = capacidadeAtual + delta;
    const saldoTotal = totalDividasSaldoDevedor();
    const prazoAtual = capacidadeAtual>0 && saldoTotal>0 ? Math.ceil(saldoTotal/capacidadeAtual) : null;
    const prazoNovo = novaCapacidade>0 && saldoTotal>0 ? Math.ceil(saldoTotal/novaCapacidade) : null;
    document.getElementById('simResult').innerHTML = `<div class="grid grid-3">
      ${kpiCard('Nova capacidade de pagamento/mês', BRL(novaCapacidade))}
      ${kpiCard('Prazo estimado atual', prazoAtual? prazoAtual+' meses':'—')}
      ${kpiCard('Novo prazo estimado', prazoNovo? prazoNovo+' meses':'—')}
    </div>
    <p style="font-size:12px;color:var(--text-faint);margin-top:10px;">Estimativa simplificada com base no saldo devedor total dividido pela capacidade mensal de pagamento — não considera juros compostos por dívida individual.</p>`;
  };
}
function simNegociacao(main){
  const card = document.createElement('div'); card.className='card section';
  card.innerHTML = `<div class="form-grid">
    <div class="field"><label>Valor atual da dívida (R$)</label><input id="sAtual" type="text" inputmode="decimal"></div>
    <div class="field"><label>Proposta à vista (R$)</label><input id="sVista" type="text" inputmode="decimal"></div>
    <div class="field"><label>OU proposta parcelada — valor total (R$)</label><input id="sParcTotal" type="text" inputmode="decimal"></div>
    <div class="field"><label>Número de parcelas da proposta</label><input id="sParcQtd" type="text" inputmode="numeric" value="1"></div>
  </div>
  <div class="form-actions" style="justify-content:flex-start;margin-top:14px;"><button class="btn btn-primary" id="simBtn">Comparar cenários</button></div>
  <div id="simResult" style="margin-top:16px;"></div>`;
  main.appendChild(card);
  card.querySelector('#simBtn').onclick = ()=>{
    const atual = parseNum(document.getElementById('sAtual').value);
    const vista = parseNum(document.getElementById('sVista').value);
    const parcTotal = parseNum(document.getElementById('sParcTotal').value);
    const parcQtd = Math.max(1, parseInt(document.getElementById('sParcQtd').value)||1);
    const descVista = atual>0? ((atual-vista)/atual)*100 : 0;
    const descParc = atual>0? ((atual-parcTotal)/atual)*100 : 0;
    const parcelaMensal = parcTotal/parcQtd;
    const renda = rendaMediaMensal();
    const impactoParc = renda>0? (parcelaMensal/renda)*100 : 0;
    document.getElementById('simResult').innerHTML = `<div class="grid grid-2">
      <div class="card"><h4 style="font-size:13.5px;margin-bottom:8px;">Cenário à vista</h4>
        ${kpiCard('Desconto', pct(descVista))}${kpiCard('Custo total', BRL(vista))}
        <p style="font-size:12px;color:var(--text-dim);margin-top:8px;">Sustentável apenas se não comprometer seu saldo disponível imediato: ${BRL(saldoDisponivelMes())}.</p>
      </div>
      <div class="card"><h4 style="font-size:13.5px;margin-bottom:8px;">Cenário parcelado</h4>
        ${kpiCard('Desconto', pct(descParc))}${kpiCard('Parcela mensal', BRL(parcelaMensal))}
        <p style="font-size:12px;color:var(--text-dim);margin-top:8px;">Impacto de ${pct(impactoParc)} na sua renda média mensal.</p>
      </div>
    </div>
    <div class="missing-data" style="margin-top:14px;">⚠️ O sistema não pode garantir que a negociação será aceita pelo credor — esta é apenas uma comparação de sustentabilidade dos cenários informados.</div>`;
  };
}

function renderMetas(main){
  pageHeader(main, 'Metas', 'Acompanhe suas metas financeiras: quitar dívidas, criar reserva, cortar gastos e mais.');

    main.innerHTML += `<div class="card"><p style="color:var(--text-dim);font-size:13px;">Nenhuma meta cadastrada ainda.</p></div>`;

  }
  const g = document.createElement('div'); g.className='grid grid-2';
  DB.metas.forEach(m=>{
    const pctv = parseNum(m.valorAlvo)>0? Math.min(100,(parseNum(m.valorAtual)/parseNum(m.valorAlvo))*100) : 0;

      <div class="row-actions"><button class="btn btn-sm btn-ghost" onclick="metaForm('${m.id}')">Editar</button><button class="btn btn-sm btn-danger" onclick="deleteItem('metas','${m.id}')">Excluir</button></div></div>
      <p style="font-size:12px;color:var(--text-faint);margin-bottom:8px;">${m.tipo} · prazo: ${m.prazo? fmtDate(m.prazo):'—'}</p>
      <div class="progress" style="margin-bottom:6px;"><div style="width:${pctv}%;background:var(--accent);"></div></div>
      <p style="font-size:12.5px;color:var(--text-dim);">${BRL(parseNum(m.valorAtual))} de ${BRL(parseNum(m.valorAlvo))} (${pct(pctv)})</p>`;
    g.appendChild(card);
  });
  main.appendChild(g);
}
function metaForm(id){
  const m = id? DB.metas.find(x=>x.id===id) : {};
  openModal(id?'Editar meta':'Nova meta', `
    <div class="form-grid">
      <div class="field"><label>Descrição</label><input id="fDesc" type="text" value="${m.descricao||''}"></div>
      <div class="field"><label>Tipo</label><select id="fTipo">${['Quitar dívida','Reduzir cartão','Aumentar renda','Cortar despesas','Criar reserva','Comprar algo sem dívida'].map(t=>`<option ${m.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Valor alvo (R$)</label><input id="fAlvo" type="text" inputmode="decimal" value="${m.valorAlvo??''}"></div>
      <div class="field"><label>Valor atual (R$)</label><input id="fAtual" type="text" inputmode="decimal" value="${m.valorAtual??'0'}"></div>
      <div class="field"><label>Prazo</label><input id="fPrazo" type="date" value="${m.prazo||''}"></div>
    </div>
    <div class="form-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="saveBtn">Salvar</button></div>
  `);
  document.getElementById('saveBtn').onclick=()=>{
    const obj = {id:id||uid(), descricao:document.getElementById('fDesc').value, tipo:document.getElementById('fTipo').value,
      valorAlvo:parseNum(document.getElementById('fAlvo').value), valorAtual:parseNum(document.getElementById('fAtual').value), prazo:document.getElementById('fPrazo').value};
    if(!obj.descricao){ toast('Descreva a meta.', true); return; }
    upsert('metas', obj); closeModal(); toast('Meta salva.'); render();
  };
}

  pageHeader(main, 'Relatórios', 'Visão consolidada dos seus dados. Exporte quando precisar.');
  const mk = thisMonthKey();
  const totalAVista = DB.comprasCartao.filter(c=>(parseInt(c.parcelas)||1)<=1).reduce((s,c)=>s+parseNum(c.valorTotal),0);

  const secoes = [
    {t:'Mensal', rows:[['Entradas do mês', BRL(totalEntradasMes(mk)+totalRendaVariavelMes(mk))],['Despesas comprometidas', BRL(valorComprometidoMes())],['Saldo do mês', BRL(saldoDisponivelMes())]]},
    {t:'Dízimo', rows:[['Entradas brutas recebidas (mês)', BRL(totalEntradasBrutasRecebidasMes(mk))],['Dízimo reservado (mês)', BRL(dizimoDoMes(mk))],['Entradas disponíveis (mês)', BRL(entradasDisponiveisMes(mk))]]},

    {t:'Apps', rows:[['Registros cadastrados', DB.apps.length],['Receita bruta (mês)', BRL(appsResumoMes(mk).receitaBruta)],['Lucro líquido (mês)', BRL(appsResumoMes(mk).lucroLiquido)]]},
    {t:'Dívidas', rows:[['Quantidade de dívidas', DB.dividas.length],['Saldo devedor total', BRL(totalDividasSaldoDevedor())],['Dívidas em atraso', DB.dividas.filter(d=>d.atrasada).length]]},
    {t:'Cartões e compras', rows:[['Cartões cadastrados', DB.cartoes.length],['Fatura total do mês', BRL(totalFaturasCartoesMes())],['Compras à vista', BRL(totalAVista)],['Compras parceladas', BRL(totalParcelado)],['Comprometimento futuro (compras)', BRL(totalComprometimentoFuturoCartoes())]]},
    {t:'Receitas', rows:[['Total de lançamentos', DB.entradas.length],['Renda média mensal', BRL(rendaMediaMensal())]]},
    {t:'Fluxo de caixa', rows:[['Saldo atual informado', BRL(parseNum(DB.config.saldoAtual))],['Comprometimento da renda', pct(comprometimentoRenda())]]},

  const g = document.createElement('div'); g.className='grid grid-2';

    c.innerHTML = `<h3 style="font-size:14px;margin-bottom:10px;">${s.t}</h3>` + s.rows.map(r=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;"><span style="color:var(--text-dim);">${r[0]}</span><span class="mono">${r[1]}</span></div>`).join('');
    g.appendChild(c);
  });
  main.appendChild(g);

  const btn = document.createElement('button'); btn.className='btn btn-primary'; btn.style.marginTop='18px'; btn.textContent='Exportar relatório (JSON)';
  btn.onclick = ()=>exportJSON(gerarRelatorioCompleto(), 'relatorio-financeiro.json');
  main.appendChild(btn);
}

    dizimo:{percentual: dizimoPercentualAtivo(), entradasBrutasRecebidas: totalEntradasBrutasRecebidasMes(mk), dizimoReservado: dizimoDoMes(mk), entradasDisponiveis: entradasDisponiveisMes(mk)},

    apps: appsResumoMes(mk),
    comprasCartao:{aVista: DB.comprasCartao.filter(c=>(parseInt(c.parcelas)||1)<=1).reduce((s,c)=>s+parseNum(c.valorTotal),0), parceladas: DB.comprasCartao.filter(c=>(parseInt(c.parcelas)||1)>1).reduce((s,c)=>s+parseNum(c.valorTotal),0), comprometimentoFuturo: totalComprometimentoFuturoCartoes()},
    dividasPriorizadas: dividasComScore(),

}

function renderBackup(main){
  pageHeader(main, 'Backup', 'Exporte, importe e proteja seus dados financeiros.');
  const card = document.createElement('div'); card.className='card section';
  card.innerHTML = `<h3 style="font-size:14px;margin-bottom:10px;">Exportar backup</h3>
    <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:12px;">Gera um arquivo .json com todos os seus dados. Guarde em local seguro.</p>
    <button class="btn btn-primary" id="exportBtn">Exportar backup (.json)</button>`;
  main.appendChild(card);
  card.querySelector('#exportBtn').onclick = ()=>{
    exportJSON(DB, `bussola-financeira-backup-${todayISO()}.json`);
    toast('Backup exportado.');
  };

  const card2 = document.createElement('div'); card2.className='card section';
  card2.innerHTML = `<h3 style="font-size:14px;margin-bottom:10px;">Importar / restaurar backup</h3>
    <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:12px;">Selecione um arquivo .json exportado anteriormente por este sistema. Os dados atuais serão substituídos após confirmação.</p>
    <input type="file" id="importFile" accept="application/json,.json">`;
  main.appendChild(card2);
  card2.querySelector('#importFile').onchange = (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const parsed = JSON.parse(e.target.result);
        if(!parsed || typeof parsed !== 'object' || !('entradas' in parsed || 'despesas' in parsed || 'dividas' in parsed)){
          toast('Arquivo inválido: não parece ser um backup deste sistema.', true); return;
        }
        if(!confirmAction('Recomenda-se criar um backup dos dados atuais antes de continuar (use "Exportar backup" acima).\n\nIsso substituirá TODOS os dados atuais pelos dados do backup. Deseja continuar?')) return;
        const d = defaultDB();
        DB = Object.assign(d, parsed, {meta:Object.assign(d.meta,parsed.meta||{}), config:Object.assign(d.config,parsed.config||{})});
        if(!Array.isArray(DB.corretagem)) DB.corretagem = [];
        if(!Array.isArray(DB.apps)) DB.apps = [];
        DB.meta.versao = 2;
        saveDB(); toast('Backup restaurado com sucesso.'); navigate('dashboard');
      }catch(err){
        toast('Não foi possível ler o arquivo. Verifique se é um JSON válido.', true);
      }
    };
    reader.readAsText(file);
  };

  const card3 = document.createElement('div'); card3.className='card';
  card3.innerHTML = `<h3 style="font-size:14px;margin-bottom:8px;">Status do armazenamento local</h3>
    <p style="font-size:12.5px;color:var(--text-dim);">Registros salvos: ${DB.entradas.length} entradas · ${DB.corretagem.length} vendas de corretagem · ${DB.apps.length} registros de apps · ${DB.despesas.length} despesas · ${DB.comprasCartao.length} compras de cartão · ${DB.cartoes.length} cartões · ${DB.dividas.length} dívidas · ${DB.metas.length} metas.</p>
    <p style="font-size:12.5px;color:var(--text-dim);margin-top:6px;">Núcleo de movimentações (novo): <b>${DB.movimentacoes.length}</b> movimentações centralizadas, geradas a partir de Entradas/Apps/Corretagem. Próximo ID: <span class="mono">MOV-${String(DB.meta.proximoIdMovimentacao||1).padStart(6,'0')}</span>.</p>
    <p style="font-size:11.5px;color:var(--text-faint);margin-top:8px;">Os dados ficam apenas neste navegador/dispositivo (localStorage). Limpar os dados do navegador apaga tudo — mantenha backups regulares. Versão da estrutura de dados: v${DB.meta.versao||1}.</p>`;
  main.appendChild(card3);

  const migCard = document.createElement('div'); migCard.className='card section'; migCard.style.marginTop='18px';
  const chavesBackupSeguranca = Object.keys(localStorage).filter(k=>k.startsWith(STORAGE_KEY+'_backup_pre_v3_'));
  migCard.innerHTML = `<h3 style="font-size:14px;margin-bottom:8px;">Backup automático de segurança</h3>
    <p style="font-size:12.5px;color:var(--text-dim);">${chavesBackupSeguranca.length
      ? 'Antes de criar o núcleo de movimentações, o sistema guardou automaticamente uma cópia intocada dos seus dados anteriores neste navegador (' + chavesBackupSeguranca.length + ' cópia(s) encontrada(s)).'
      : 'Nenhuma migração estrutural foi executada neste dispositivo ainda (ou os dados já nasceram no formato atual).'}</p>
    <p style="font-size:11.5px;color:var(--text-faint);margin-top:8px;">Essa cópia automática é uma rede de segurança extra — continue exportando o backup .json regularmente pelo botão acima.</p>`;
  main.appendChild(migCard);
}
function exportJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
}

/* ======================================================================
   CRUD GENÉRICO
====================================================================== */
function upsert(collection, obj){
  const arr = DB[collection];
  const idx = arr.findIndex(x=>x.id===obj.id);
  if(idx>=0) arr[idx]=obj; else arr.push(obj);
  saveDB();
}
const COLECOES_COM_MOVIMENTACAO = ['entradas','apps','corretagem'];
function deleteItem(collection, id){
  if(!confirmAction('Excluir este item? Esta ação não pode ser desfeita.')) return;
  DB[collection] = DB[collection].filter(x=>x.id!==id);
  if(COLECOES_COM_MOVIMENTACAO.includes(collection)){
    removerMovimentacaoPorOrigem(collection, id); // evita movimentação órfã
  }
  saveDB(); toast('Item excluído.'); render();
}

buildNav();
navigate('dashboard');
