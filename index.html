  // ---------- NOME DO CENÁRIO (opcional, só na sessão) ----------
  const nomeCard = document.createElement('div'); nomeCard.className='card section';
  nomeCard.innerHTML = `<div class="field"><label>Nome do cenário (opcional)</label><input id="simNome" type="text" placeholder='Ex: "Quitar cartão", "Nova renda"' value="${esc(SIM_NOME_CENARIO)}"></div>`;
  main.appendChild(nomeCard);
  nomeCard.querySelector('#simNome').onchange = (e)=>{ SIM_NOME_CENARIO = e.target.value; };

  // ---------- SITUAÇÃO ATUAL (cenário base — dados reais) ----------
  const secBase = document.createElement('div'); secBase.className='section';
  secBase.innerHTML = dashSectionHead('📍', 'SITUAÇÃO ATUAL (dados reais)');
  main.appendChild(secBase);
  const gBase = document.createElement('div'); gBase.className='grid grid-4 section';
  gBase.innerHTML = kpiCard('Entradas do mês', BRL(SIM_BASELINE.entradas)) +
    kpiCard('Comprometido no mês', BRL(SIM_BASELINE.despesas)) +
    kpiCard('Saldo disponível', BRL(SIM_BASELINE.saldo), SIM_BASELINE.saldo<0?'neg':'pos') +
    kpiCard('Saúde financeira', SIM_BASELINE.saude+'/100');
  main.appendChild(gBase);

  // ---------- ALTERAÇÕES ----------
  const secAlt = document.createElement('div'); secAlt.className='section';
  secAlt.innerHTML = dashSectionHead('🧪', 'ALTERAÇÕES DO CENÁRIO', 'Adicione uma ou mais alterações — o resultado combinado aparece abaixo');
  main.appendChild(secAlt);

  const sub = document.createElement('div'); sub.className='subtabs';
  const tipos = [
    {id:'renda', l:'💰 Renda extra'}, {id:'despesa_reducao', l:'✂️ Reduzir despesa'},
    {id:'pagar_divida', l:'💳 Pagar/quitar dívida'}, {id:'nova_despesa', l:'🧾 Nova despesa'},
    {id:'nova_parcela', l:'📅 Nova parcela'}, {id:'meta_aporte', l:'🎯 Aporte em meta'},
    {id:'cartao_compra', l:'▭ Compra no cartão'}
  ];
  let tipoAtivo = renderSimuladorEse._tipo || 'renda';
  tipos.forEach(t=>{
    const b = document.createElement('button'); b.textContent = t.l; b.className = tipoAtivo===t.id?'active':'';
    b.onclick = ()=>{ renderSimuladorEse._tipo = t.id; render(); };
    sub.appendChild(b);
  });
  main.appendChild(sub);

  const formCard = document.createElement('div'); formCard.className='card section';
  simRenderFormAlteracao(formCard, tipoAtivo);
  main.appendChild(formCard);

  // ---------- LISTA DE ALTERAÇÕES APLICADAS ----------
  if(SIM_ALTERACOES.length){
    const listSec = document.createElement('div'); listSec.className='section';
    listSec.innerHTML = `<div class="section-head"><h2>Alterações aplicadas${SIM_NOME_CENARIO?' — "'+esc(SIM_NOME_CENARIO)+'"':''}</h2></div>`;
    main.appendChild(listSec);
    SIM_ALTERACOES.forEach(a=>{
      const row = document.createElement('div'); row.className='reco-item';
      row.innerHTML = `<div class="body" style="flex:1;"><b>${esc(a.label)}</b></div>`;
      const rm = document.createElement('button'); rm.className='btn btn-sm btn-danger'; rm.textContent='✕ remover';
      rm.onclick = ()=>simRemoverAlteracao(a.id);
      row.appendChild(rm);
      listSec.appendChild(row);
    });
  } else {
    main.innerHTML += dashEmptyCard('Nenhuma alteração aplicada ainda — o cenário simulado é idêntico ao real.');
  }

  // ---------- RESULTADO / COMPARAÇÃO ----------
  const atual = simColetarIndicadores();
  const secComp = document.createElement('div'); secComp.className='section';
  secComp.innerHTML = dashSectionHead('⚖️', 'CENÁRIO SIMULADO — comparação com o real');
  main.appendChild(secComp);
  const wrap = document.createElement('div'); wrap.className='table-wrap';
  wrap.innerHTML = `<table><thead><tr><th>Indicador</th><th>Atual (real)</th><th>Simulado</th><th>Diferença</th></tr></thead><tbody>
    ${simLinhaComparacao('Entradas do mês', SIM_BASELINE.entradas, atual.entradas, BRL, true)}
    ${simLinhaComparacao('Comprometido no mês', SIM_BASELINE.despesas, atual.despesas, BRL, false)}
    ${simLinhaComparacao('Saldo disponível', SIM_BASELINE.saldo, atual.saldo, BRL, true)}
    ${simLinhaComparacao('Comprometimento da renda', SIM_BASELINE.comprometimento, atual.comprometimento, v=>pct(v), false)}
    ${simLinhaComparacao('Saldo devedor total (dívidas)', SIM_BASELINE.dividas, atual.dividas, BRL, false)}
    ${simLinhaComparacao('Uso médio do limite dos cartões', SIM_BASELINE.cartoesPct, atual.cartoesPct, v=>pct(v), false)}
    ${simLinhaComparacao('Saúde financeira (0-100)', SIM_BASELINE.saude, atual.saude, v=>Math.round(v)+'/100', true)}
  </tbody></table>`;
  main.appendChild(wrap);

  // ---------- ALERTAS DO CENÁRIO ----------
  const secAlertas = document.createElement('div'); secAlertas.className='section';
  secAlertas.innerHTML = dashSectionHead('🚨', 'ALERTAS DO CENÁRIO', 'Calculados sobre a simulação — não são alertas reais e não ficam salvos');
  main.appendChild(secAlertas);
  const alertasSim = gerarAlertas();
  if(alertasSim.length===0){
    secAlertas.innerHTML += dashEmptyCard('Nenhum alerta identificado neste cenário.');
  } else {
    const g = document.createElement('div'); g.style.cssText='display:flex;flex-direction:column;gap:8px;';
    alertasSim.slice(0,6).forEach(a=>{
      const info = ALERTA_NIVEL_INFO[a.nivel];
      const c = document.createElement('div'); c.className='card';
      c.innerHTML = `<div class="section-head" style="margin-bottom:4px;"><h3 style="font-size:13.5px;">${info.emoji} ${esc(a.titulo)}</h3><span class="tag">cenário</span></div><p style="font-size:12.5px;color:var(--text-dim);">${a.descricao}</p>`;
      g.appendChild(c);
    });
    secAlertas.appendChild(g);
  }

  // ---------- CONSULTOR (leitura do cenário simulado) ----------
  const secCons = document.createElement('div'); secCons.className='section';
  secCons.innerHTML = dashSectionHead('🧠', 'O QUE O CONSULTOR DIZ SOBRE ESTE CENÁRIO');
  main.appendChild(secCons);
  const analise = gerarAnaliseConsultor();
  if(!analise.temDados){
    secCons.innerHTML += dashEmptyCard('Dados insuficientes para uma análise do cenário.');
  } else if(analise.positiva){
    secCons.innerHTML += `<div class="card"><p style="font-size:13px;">🟢 Este cenário melhora ou mantém sua situação financeira: <b>${analise.situacao.texto}</b></p></div>`;
  } else {
    secCons.innerHTML += `<div class="card"><p style="font-size:13px;">${ALERTA_NIVEL_INFO[analise.principal.nivel].emoji} Este cenário ainda apresenta pressão financeira porque: <b>${analise.principal.descricao}</b></p><p style="font-size:12.5px;color:var(--text-dim);margin-top:6px;"><b>Ação recomendada:</b> ${analise.principal.acao}</p></div>`;
  }

  // ---------- DÍVIDAS (ranking simulado) ----------
  if(DB.dividas.length){
    const secD = document.createElement('div'); secD.className='section';
    secD.innerHTML = dashSectionHead('💳', 'DÍVIDAS — ranking do cenário');
    main.appendChild(secD);
    const rank = dividasComScore().slice(0,5);
    const w = document.createElement('div'); w.className='table-wrap';
    w.innerHTML = `<table><thead><tr><th>Credor</th><th>Saldo simulado</th><th>Parcela</th><th>Prioridade</th></tr></thead><tbody>
      ${rank.map(d=>`<tr><td>${esc(d.credor)||'—'}</td><td class="mono">${BRL(parseNum(d.saldoDevedor))}</td><td class="mono">${BRL(parseNum(d.valorParcela))}</td><td><span class="status-pill ${d.nivel.cls}">${d.nivel.emoji} ${d.nivel.label}</span></td></tr>`).join('')}
    </tbody></table>`;
    secD.appendChild(w);
  }

  // ---------- CARTÕES (resumo simulado) ----------
  if(DB.cartoes.length){
    const secC = document.createElement('div'); secC.className='section';
    secC.innerHTML = dashSectionHead('▭', 'CARTÕES — resumo do cenário');
    main.appendChild(secC);
    const rc = cartoesResumoConsolidado();
    const g = document.createElement('div'); g.className='grid grid-3';
    g.innerHTML = kpiCard('Fatura total do mês (simulada)', BRL(rc.faturaTotal)) +
      kpiCard('Usado do limite (simulado)', BRL(rc.usadoTotal)) +
      kpiCard('Disponível (simulado)', BRL(rc.disponivelTotal));
    secC.appendChild(g);
  }

  // ---------- METAS (comparação simulada) ----------
  if(DB.metas.length){
    const secM = document.createElement('div'); secM.className='section';
    secM.innerHTML = dashSectionHead('🎯', 'METAS — progresso do cenário');
    main.appendChild(secM);
    const w = document.createElement('div'); w.className='table-wrap';
    w.innerHTML = `<table><thead><tr><th>Meta</th><th>Progresso simulado</th><th>Restante</th></tr></thead><tbody>
      ${DB.metas.map(m=>{ const st=metaStatus(m); return `<tr><td>${esc(m.descricao)}</td><td class="mono">${st.pctv===null?'—':pct(st.pctv)}</td><td class="mono">${st.restante===null?'—':BRL(st.restante)}</td></tr>`; }).join('')}
    </tbody></table>`;
    secM.appendChild(w);
  }

  const rodape = document.createElement('div'); rodape.className='missing-data'; rodape.style.marginTop='18px';
  rodape.innerHTML = '⚠️ Este cenário existe apenas nesta tela. Ele nunca é salvo automaticamente e é descartado ao sair do Simulador "E Se?" ou ao recarregar a página.';
  main.appendChild(rodape);
}

// Constrói o formulário específico de cada tipo de alteração e conecta o botão "Aplicar".
function simRenderFormAlteracao(container, tipo){
  const dividasDisp = DB.dividas.filter(d=>parseNum(d.saldoDevedor)>0);
  const metasDisp = DB.metas;
  const cartoesDisp = DB.cartoes;

  let html = '';
  if(tipo==='renda'){
    html = `<div class="form-grid">
      <div class="field"><label>Descrição (opcional)</label><input id="sDesc" type="text" placeholder="Ex: Freelance extra"></div>
      <div class="field"><label>Aumento de renda mensal (R$)</label><input id="sValor" type="text" inputmode="decimal"></div>
    </div>`;
  } else if(tipo==='despesa_reducao'){
    html = `<div class="form-grid"><div class="field"><label>Redução de despesas mensal (R$)</label><input id="sValor" type="text" inputmode="decimal"></div></div>
    <p class="missing-data" style="margin-top:10px;">Isto é um ajuste temporário do cenário — não cria uma despesa negativa nem aparece nos seus relatórios ou no calendário reais.</p>`;
  } else if(tipo==='pagar_divida'){
    if(dividasDisp.length===0){ html = `<p style="font-size:13px;color:var(--text-dim);">Nenhuma dívida com saldo devedor cadastrado para simular pagamento.</p>`; }
    else {
      html = `<div class="form-grid">
        <div class="field"><label>Dívida</label><select id="sDivida">${dividasDisp.map(d=>`<option value="${d.id}">${esc(d.credor)||'sem nome'} — saldo ${BRL(parseNum(d.saldoDevedor))}</option>`).join('')}</select></div>
        <div class="field"><label>Valor do pagamento (R$)</label><input id="sValor" type="text" inputmode="decimal" placeholder="Use o saldo total para simular quitação"></div>
      </div>
      <p class="missing-data" style="margin-top:10px;">Pagamento parcial reduz apenas o saldo devedor simulado — a parcela mensal só muda quando a dívida é quitada totalmente (saldo chega a zero).</p>`;
    }
  } else if(tipo==='nova_despesa'){
    html = `<div class="form-grid">
      <div class="field"><label>Descrição</label><input id="sDesc" type="text"></div>
      <div class="field"><label>Valor (R$)</label><input id="sValor" type="text" inputmode="decimal"></div>
      <div class="field"><label>Frequência</label><select id="sFreq"><option>Única</option><option>Mensal fixa</option></select></div>
    </div>`;
  } else if(tipo==='nova_parcela'){
    html = `<div class="form-grid">
      <div class="field"><label>Descrição</label><input id="sDesc" type="text"></div>
      <div class="field"><label>Valor da parcela (R$)</label><input id="sValor" type="text" inputmode="decimal"></div>
      <div class="field"><label>Número de parcelas</label><input id="sQtd" type="text" inputmode="numeric" value="1"></div>
    </div>`;
  } else if(tipo==='meta_aporte'){
    if(metasDisp.length===0){ html = `<p style="font-size:13px;color:var(--text-dim);">Nenhuma meta cadastrada para simular aporte.</p>`; }
    else {
      html = `<div class="form-grid">
        <div class="field"><label>Meta</label><select id="sMeta">${metasDisp.map(m=>`<option value="${m.id}">${esc(m.descricao)}</option>`).join('')}</select></div>
        <div class="field"><label>Valor do aporte (R$)</label><input id="sValor" type="text" inputmode="decimal"></div>
      </div>`;
    }
  } else if(tipo==='cartao_compra'){
    if(cartoesDisp.length===0){ html = `<p style="font-size:13px;color:var(--text-dim);">Nenhum cartão cadastrado para simular compra.</p>`; }
    else {
      html = `<div class="form-grid">
        <div class="field"><label>Cartão</label><select id="sCartao">${cartoesDisp.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
        <div class="field"><label>Descrição</label><input id="sDesc" type="text"></div>
        <div class="field"><label>Valor total (R$)</label><input id="sValor" type="text" inputmode="decimal"></div>
        <div class="field"><label>Parcelas</label><input id="sParc" type="text" inputmode="numeric" value="1"></div>
      </div>`;
    }
  }
  container.innerHTML = html + `<div class="form-actions" style="justify-content:flex-start;margin-top:14px;"><button class="btn btn-primary" id="simAplicarBtn">Aplicar alteração</button></div>`;

  const btn = container.querySelector('#simAplicarBtn');
  if(!btn) return; // sem dado cadastrado para este tipo (ex: nenhuma dívida) — nada a aplicar
  btn.onclick = ()=>{
    const val = (id)=> container.querySelector('#'+id) ? parseNum(container.querySelector('#'+id).value) : 0;
    const txt = (id)=> container.querySelector('#'+id) ? container.querySelector('#'+id).value : '';

    if(tipo==='renda'){
      const valor = val('sValor');
      if(valor<=0){ toast('Informe um valor de renda extra maior que zero.', true); return; }
      simAdicionarAlteracao({tipo, valor, descricao: txt('sDesc'), label:`💰 Renda extra de ${BRL(valor)}/mês`});
    } else if(tipo==='despesa_reducao'){
      const valor = val('sValor');
      if(valor<=0){ toast('Informe um valor de redução maior que zero.', true); return; }
      simAdicionarAlteracao({tipo, valor, label:`✂️ Redução de despesas de ${BRL(valor)}/mês`});
    } else if(tipo==='pagar_divida'){
      const dividaId = txt('sDivida'); const valor = val('sValor');
      const d = DB.dividas.find(x=>x.id===dividaId);
      if(!d){ toast('Selecione uma dívida.', true); return; }
      if(valor<=0){ toast('Informe um valor de pagamento maior que zero.', true); return; }
      const quitacao = valor >= parseNum(d.saldoDevedor);
      simAdicionarAlteracao({tipo, dividaId, valor, label:`💳 ${quitacao?'Quitação total':'Pagamento'} de ${BRL(valor)} em "${d.credor||'dívida sem nome'}"`});
    } else if(tipo==='nova_despesa'){
      const descricao = txt('sDesc'); const valor = val('sValor'); const frequencia = txt('sFreq');
      if(!descricao){ toast('Descreva a nova despesa.', true); return; }
      if(valor<=0){ toast('Informe um valor maior que zero.', true); return; }
      simAdicionarAlteracao({tipo, descricao, valor, frequencia, label:`🧾 Nova despesa "${descricao}" de ${BRL(valor)} (${frequencia})`});
    } else if(tipo==='nova_parcela'){
      const descricao = txt('sDesc'); const valorParcela = val('sValor'); const qtdParcelas = parseInt(txt('sQtd'))||1;
      if(!descricao){ toast('Descreva a nova parcela.', true); return; }
      if(valorParcela<=0){ toast('Informe um valor de parcela maior que zero.', true); return; }
      simAdicionarAlteracao({tipo, descricao, valorParcela, qtdParcelas, label:`📅 Nova parcela "${descricao}" de ${BRL(valorParcela)} x${qtdParcelas}`});
    } else if(tipo==='meta_aporte'){
      const metaId = txt('sMeta'); const valor = val('sValor');
      const m = DB.metas.find(x=>x.id===metaId);
      if(!m){ toast('Selecione uma meta.', true); return; }
      if(valor<=0){ toast('Informe um valor de aporte maior que zero.', true); return; }
      simAdicionarAlteracao({tipo, metaId, valor, label:`🎯 Aporte de ${BRL(valor)} na meta "${m.descricao}"`});
    } else if(tipo==='cartao_compra'){
      const cartaoId = txt('sCartao'); const descricao = txt('sDesc'); const valor = val('sValor'); const parcelas = parseInt(txt('sParc'))||1;
      const c = DB.cartoes.find(x=>x.id===cartaoId);
      if(!c){ toast('Selecione um cartão.', true); return; }
      if(!descricao){ toast('Descreva a compra.', true); return; }
      if(valor<=0){ toast('Informe um valor maior que zero.', true); return; }
      simAdicionarAlteracao({tipo, cartaoId, descricao, valor, parcelas, label:`▭ Compra "${descricao}" de ${BRL(valor)} em ${parcelas}x no ${c.nome}`});
    }
  };
}

function exportJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
}

/* ======================================================================
   CRUD GENÉRICO
====================================================================== */
function upsert(collection, obj){
  const arr = DB[collection];
  const idx = arr.findIndex(x=>x.id===obj.id);
  if(idx>=0) arr[idx]=obj; else arr.push(obj);
  saveDB();
}
const COLECOES_COM_MOVIMENTACAO = ['entradas','apps','corretagem'];
function deleteItem(collection, id){
  if(!confirmAction('Excluir este item? Esta ação não pode ser desfeita.')) return;
  DB[collection] = DB[collection].filter(x=>x.id!==id);
  if(COLECOES_COM_MOVIMENTACAO.includes(collection)){
    removerMovimentacaoPorOrigem(collection, id); // evita movimentação órfã
  }
  saveDB(); toast('Item excluído.'); render();
}

/* ======================================================================
   INIT
====================================================================== */
buildNav();
navigate('dashboard');
</script>
