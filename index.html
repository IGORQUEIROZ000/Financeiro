<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Bússola Financeira — Sistema de Recuperação Financeira</title>
<style>
:root{
  --bg:#0b1220;
  --bg-elev:#111a2b;
  --bg-card:#151f33;
  --bg-card-hover:#1a2540;
  --border:#233150;
  --border-light:#2c3b5e;
  --text:#e7ecf7;
  --text-dim:#9aa8c7;
  --text-faint:#69769a;
  --accent:#3b82f6;
  --accent-dim:#1d4ed8;
  --mono: 'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  --sans: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --green:#22c55e;
  --green-bg:rgba(34,197,94,.12);
  --yellow:#eab308;
  --yellow-bg:rgba(234,179,8,.12);
  --orange:#f97316;
  --orange-bg:rgba(249,115,22,.12);
  --red:#ef4444;
  --red-bg:rgba(239,68,68,.12);
  --purple:#a855f7;
  --radius:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
body{min-height:100vh;}
::selection{background:var(--accent-dim);color:#fff;}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
a{color:var(--accent);}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:230px;flex-shrink:0;background:var(--bg-elev);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
#sidebar .brand{padding:20px 18px 14px;border-bottom:1px solid var(--border);}
#sidebar .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;margin-bottom:10px;}
#sidebar .brand h1{font-size:15px;line-height:1.3;}
#sidebar .brand .sub{font-size:11px;color:var(--text-faint);margin-top:2px;}
nav.tabs{flex:1;padding:10px 8px;}
nav.tabs button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
  color:var(--text-dim);padding:9px 10px;border-radius:8px;font-size:13px;margin-bottom:2px;transition:.12s;
}
nav.tabs button .ic{width:18px;text-align:center;font-size:14px;}
nav.tabs button:hover{background:var(--bg-card);color:var(--text);}
nav.tabs button.active{background:var(--accent-dim);color:#fff;}
#sidebar .foot{padding:12px;border-top:1px solid var(--border);font-size:10.5px;color:var(--text-faint);}
#main{flex:1;min-width:0;padding:26px 30px 80px;max-width:1180px;}
.page-title{margin-bottom:4px;font-size:22px;}
.page-sub{color:var(--text-dim);font-size:13px;margin-bottom:22px;}

/* mobile */
#topbar{display:none;position:sticky;top:0;z-index:40;background:var(--bg-elev);border-bottom:1px solid var(--border);padding:12px 16px;align-items:center;justify-content:space-between;}
#topbar .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
#menuBtn{background:var(--bg-card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-size:16px;}
@media (max-width:900px){
  #topbar{display:flex;}
  #sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:50;transition:left .18s;box-shadow:8px 0 30px rgba(0,0,0,.4);}
  #sidebar.open{left:0;}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;}
  #overlay.show{display:block;}
  #main{padding:16px 14px 70px;}
}

/* ---------- cards / grids ---------- */
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:900px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr 1fr;}}
@media (max-width:560px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.kpi .label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.kpi .value{font-size:22px;font-weight:700;}
.kpi .value.mono{font-family:var(--mono);}
.kpi .delta{font-size:11.5px;margin-top:6px;color:var(--text-dim);}
.pos{color:var(--green);} .neg{color:var(--red);}

.section{margin-bottom:26px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.section-head h2{font-size:15px;}
.section-head .hint{font-size:12px;color:var(--text-faint);}

/* status badges */
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;}
.st-green{background:var(--green-bg);color:var(--green);}
.st-yellow{background:var(--yellow-bg);color:var(--yellow);}
.st-orange{background:var(--orange-bg);color:var(--orange);}
.st-red{background:var(--red-bg);color:var(--red);}
.st-purple{background:rgba(168,85,247,.12);color:var(--purple);}

.big-status{border-radius:var(--radius);padding:20px 22px;border:1px solid var(--border);margin-bottom:18px;display:flex;align-items:center;gap:16px;}
.big-status .emoji{font-size:34px;}
.big-status .txt h3{font-size:16px;margin-bottom:4px;}
.big-status .txt p{font-size:13px;color:var(--text-dim);}

/* buttons */
.btn{background:var(--bg-card-hover);border:1px solid var(--border-light);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-dim);}
.btn-danger{background:transparent;border-color:var(--red);color:var(--red);}
.btn-danger:hover{background:var(--red-bg);}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:6px;}
.btn-ghost{background:transparent;border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--accent);}
.row-actions{display:flex;gap:6px;}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px;}
th{text-align:left;padding:10px 12px;color:var(--text-faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg-card-hover);}
.empty-row td{color:var(--text-faint);text-align:center;padding:30px;white-space:normal;}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media (max-width:700px){.form-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:480px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11.5px;color:var(--text-dim);font-weight:600;}
.field input,.field select,.field textarea{
  background:var(--bg);border:1px solid var(--border-light);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13px;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field.chk{flex-direction:row;align-items:center;gap:8px;}
.field textarea{resize:vertical;min-height:50px;}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}

/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(4,8,16,.6);z-index:100;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.modal-bg.show{display:flex;}
.modal{background:var(--bg-elev);border:1px solid var(--border-light);border-radius:var(--radius);padding:22px;width:100%;max-width:640px;}
.modal h3{font-size:16px;margin-bottom:16px;}
.modal-close{float:right;background:none;border:none;color:var(--text-faint);font-size:18px;}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.filters input,.filters select{background:var(--bg-card);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:12.5px;}

/* toast */
#toast{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast-item{background:var(--bg-elev);border:1px solid var(--border-light);border-left:3px solid var(--accent);padding:11px 15px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:320px;animation:slideIn .18s ease-out;}
.toast-item.err{border-left-color:var(--red);}
@keyframes slideIn{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* misc */
.tag{display:inline-block;background:var(--bg);border:1px solid var(--border-light);padding:2px 8px;border-radius:6px;font-size:11px;color:var(--text-dim);}
.divider{height:1px;background:var(--border);margin:18px 0;}
.explain-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);margin:8px 0;}
.explain-flow .step{background:var(--bg);border:1px solid var(--border);padding:6px 10px;border-radius:8px;}
.explain-flow .arrow{color:var(--text-faint);}
.reco-item{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--bg);}
.reco-item .rank{font-weight:800;font-size:13px;flex-shrink:0;width:26px;}
.reco-item .body b{display:block;font-size:13.5px;margin-bottom:3px;}
.reco-item .body span{font-size:12.5px;color:var(--text-dim);}
.progress{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--border);}
.progress > div{height:100%;border-radius:99px;}
.missing-data{background:var(--yellow-bg);border:1px solid rgba(234,179,8,.35);color:#f4d160;border-radius:10px;padding:12px 14px;font-size:12.5px;margin-bottom:14px;}
.hero-score{display:flex;align-items:center;gap:22px;}
.score-ring{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--mono);font-size:22px;font-weight:700;position:relative;}
.checkbox-list{display:flex;flex-direction:column;gap:8px;}
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.subtabs button{background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;}
.subtabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
</style>
</head>
<body>

<div id="topbar">
  <button id="menuBtn">☰</button>
  <div style="display:flex;align-items:center;gap:8px;"><div class="mark">B</div><b style="font-size:14px;">Bússola Financeira</b></div>
  <div style="width:34px;"></div>
</div>
<div id="overlay"></div>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="mark">B</div>
      <h1>Bússola Financeira</h1>
      <div class="sub">Sistema de recuperação e controle</div>
    </div>
    <nav class="tabs" id="navTabs"></nav>
    <div class="foot">Dados salvos apenas neste dispositivo (localStorage). Faça backup regularmente.</div>
  </aside>

  <main id="main"></main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* ======================================================================
   BÚSSOLA FINANCEIRA — MOTOR DO SISTEMA
   Tudo funciona 100% localmente via localStorage. Sem servidor, sem internet.
====================================================================== */

const STORAGE_KEY = 'bussola_financeira_v1';
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function defaultDB(){
  return {
    meta:{ criadoEm: todayISO(), versao:3, primeiroAcessoFeito:false, proximoIdMovimentacao:1 },
    config:{ nome:'', saldoAtual:0, metaComprometimento:70, dizimoAtivo:true, dizimoPercentual:10 },
    entradas:[],       // receitas
    rendaVariavel:[],  // logs de apps/trabalhos extras (módulo original — preservado)
    despesas:[],        // despesas gerais (fixas/variáveis/extraordinárias)
    moradia:[],          // itens de moradia (mensal fixo)
    cartoes:[],           // cartões cadastrados
    comprasCartao:[],      // compras em cartão (parceladas ou não)
    dividas:[],              // dívidas
    metas:[],                 // metas financeiras
    decisoes:[],                // histórico de decisões
    corretagem:[],                // comissões de corretagem imobiliária
    apps:[],                       // controle operacional diário de apps (Uber/99/iFood/Giross/Outros)
    movimentacoes:[]                // NOVO (fase de integração): núcleo central — 1 registro por dinheiro que entra/sai, ligado por movimentacaoId ao módulo de origem (entradas/apps/corretagem)
  };
}

let DB = loadDB();

// Backup automático de segurança: roda 1x antes de qualquer migração estrutural,
// guardando uma cópia intocada dos dados antigos numa chave separada do localStorage.
// Não substitui o backup manual (.json) — é uma rede de segurança extra.
function backupDeSegurancaAntesDeMigrar(rawAntigo){
  try{
    const chave = STORAGE_KEY + '_backup_pre_v3_' + Date.now();
    localStorage.setItem(chave, rawAntigo);
  }catch(e){
    console.error('Não foi possível criar backup de segurança automático.', e);
  }
}

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    const versaoAntiga = (parsed.meta && parsed.meta.versao) || 1;
    // merge com default para garantir todas as chaves em upgrades futuros (migração automática)
    const d = defaultDB();
    const merged = Object.assign(d, parsed, {
      meta: Object.assign(d.meta, parsed.meta||{}),
      config: Object.assign(d.config, parsed.config||{})
    });
    // garante arrays novos mesmo se o backup antigo não os tinha
    if(!Array.isArray(merged.corretagem)) merged.corretagem = [];
    if(!Array.isArray(merged.apps)) merged.apps = [];
    if(!Array.isArray(merged.movimentacoes)) merged.movimentacoes = [];
    if(!merged.meta.proximoIdMovimentacao) merged.meta.proximoIdMovimentacao = 1;
    if(versaoAntiga < 3){
      backupDeSegurancaAntesDeMigrar(raw);
      migrarParaMovimentacoes(merged);
    }
    merged.meta.versao = 3;
    return merged;
  }catch(e){
    console.error('Erro ao carregar dados, iniciando novo banco.', e);
    return defaultDB();
  }
}

function saveDB(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    return true;
  }catch(e){
    toast('Falha ao salvar dados no dispositivo. Verifique o espaço de armazenamento.', true);
    return false;
  }
}

/* ======================================================================
   NÚCLEO: MOVIMENTAÇÕES
   Registro central de todo dinheiro que entra/sai. Cada movimentação nasce
   ligada a um módulo de origem (entradas/apps/corretagem) via origemModulo+
   origemId, para nunca contar o mesmo dinheiro duas vezes. Os módulos de
   origem continuam existindo e funcionando exatamente como antes — esta
   camada apenas espelha e centraliza, não substitui nada ainda.
====================================================================== */
function gerarIdMovimentacao(){
  const n = DB.meta.proximoIdMovimentacao || 1;
  DB.meta.proximoIdMovimentacao = n + 1;
  return 'MOV-' + String(n).padStart(6,'0');
}
// Cria ou atualiza a movimentação ligada a um registro de origem (nunca duplica).
function upsertMovimentacaoPorOrigem(origemModulo, origemId, dados){
  const agora = new Date().toISOString();
  let mov = DB.movimentacoes.find(m=>m.origemModulo===origemModulo && m.origemId===origemId);
  if(mov){
    Object.assign(mov, dados, {atualizadoEm: agora});
  }else{
    mov = Object.assign({
      id: gerarIdMovimentacao(), origemModulo, origemId, criadoEm: agora, atualizadoEm: agora
    }, dados);
    DB.movimentacoes.push(mov);
  }
  return mov;
}
function removerMovimentacaoPorOrigem(origemModulo, origemId){
  DB.movimentacoes = DB.movimentacoes.filter(m=>!(m.origemModulo===origemModulo && m.origemId===origemId));
}
// Migração única (roda 1x ao detectar dados anteriores à v3): gera o histórico
// de movimentações a partir do que já existe em Entradas, Apps e Corretagem.
// Não apaga nem altera nenhum registro original.
function migrarParaMovimentacoes(db){
  (db.entradas||[]).forEach(e=>{
    upsertMovimentacaoPorOriginoDB(db, 'entradas', e.id, {
      data: e.data, tipo:'Entrada', valor: parseNum(e.valorLiquido),
      categoria: e.categoria || e.tipo || '', origem: e.fonte || '',
      descricao: e.descricao || '', observacoes: e.obs || '',
      status: e.recebido ? 'Recebido' : 'Pendente'
    });
  });
  (db.apps||[]).forEach(a=>{
    const i = appInfo(a);
    upsertMovimentacaoPorOriginoDB(db, 'apps', a.id, {
      data: a.data, tipo:'Entrada', valor: i.lucroLiquido,
      categoria:'Aplicativo', origem: a.app || '',
      descricao: 'Corrida/turno ' + (a.app||''), observacoes: a.observacoes || '',
      status:'Recebido'
    });
  });
  (db.corretagem||[]).forEach(c=>{
    const recebido = parseNum(c.valorRecebido);
    upsertMovimentacaoPorOriginoDB(db, 'corretagem', c.id, {
      data: c.dataRecebimento || c.data, tipo:'Entrada', valor: recebido,
      categoria:'Corretagem', origem: c.cliente || '',
      descricao: 'Comissão — ' + (c.imovel||c.cliente||''), observacoes: c.observacoes || '',
      status: recebido>0 ? 'Recebido' : 'Pendente'
    });
  });
}
// Igual a upsertMovimentacaoPorOrigem, mas recebe o db explicitamente (usado só na migração,
// já que nesse momento a variável global DB ainda pode não estar totalmente atribuída).
function upsertMovimentacaoPorOriginoDB(db, origemModulo, origemId, dados){
  const agora = new Date().toISOString();
  const n = db.meta.proximoIdMovimentacao || 1;
  db.meta.proximoIdMovimentacao = n + 1;
  let mov = db.movimentacoes.find(m=>m.origemModulo===origemModulo && m.origemId===origemId);
  if(mov){ Object.assign(mov, dados, {atualizadoEm: agora}); }
  else{ db.movimentacoes.push(Object.assign({id:'MOV-'+String(n).padStart(6,'0'), origemModulo, origemId, criadoEm: agora, atualizadoEm: agora}, dados)); }
}

/* ---------------- helpers de formatação ---------------- */
function BRL(v){
  if(v===null||v===undefined||isNaN(v)) v=0;
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function pct(v,casas=1){ if(v===null||v===undefined||isNaN(v)) v=0; return v.toFixed(casas)+'%'; }
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  if(!y) return iso;
  return `${d}/${m}/${y}`;
}
function parseNum(v){
  if(typeof v === 'number') return v;
  if(!v) return 0;
  const n = parseFloat(String(v).replace(/\./g,'').replace(',','.').replace(/[^0-9.\-]/g,''));
  return isNaN(n)?0:n;
}
function round2(v){ return Math.round((v+Number.EPSILON)*100)/100; }
function monthKey(iso){ return iso ? iso.slice(0,7) : ''; }
function thisMonthKey(){ return todayISO().slice(0,7); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function addMonths(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
}
// diferença de competência (meses) entre dois "YYYY-MM"
function monthsDiff(mkA, mkB){
  if(!mkA||!mkB) return 0;
  const [ya,ma] = mkA.split('-').map(Number);
  const [yb,mb] = mkB.split('-').map(Number);
  return (yb-ya)*12 + (mb-ma);
}
// escape simples de HTML para textos vindos de dados do usuário (segurança contra innerHTML)
function esc(v){
  if(v===null||v===undefined) return '';
  return String(v).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast-item'+(isErr?' err':'');
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>el.remove(),300); }, 3400);
}

function confirmAction(msg){ return window.confirm(msg); }

/* ======================================================================
   NAVEGAÇÃO
====================================================================== */
const TABS = [
  {id:'dashboard', label:'Dashboard', ic:'◆'},
  {id:'entradas', label:'Entradas', ic:'↓'},

// --- comprometimento futuro de uma compra de cartão ---
// Cálculo por COMPETÊNCIA (mês da parcela), não por estimativa de dias corridos.
// Distingue PREVISTA / PAGA / ATRASADA sem remover a inferência automática já existente (mês decorrido = presumidamente paga).
function compraCartaoInfo(c){
  const parcelas = Math.max(1, parseInt(c.parcelas)||1);
  const valorParcela = round2(c.valorTotal / parcelas);
  const mesCompra = monthKey(c.data) || thisMonthKey();
  const mesAtual = thisMonthKey();
  const decorridos = Math.max(0, monthsDiff(mesCompra, mesAtual)); // meses de competência já vencidos
  const parcelasPagas = Math.min(parcelas, decorridos);
  const parcelasRestantes = Math.max(0, parcelas - parcelasPagas);
  const comprometimentoFuturo = round2(parcelasRestantes * valorParcela);
  const quitada = parcelasRestantes<=0;
  const parcelaAtualNum = quitada ? parcelas : Math.min(parcelas, parcelasPagas+1);
  const parcelaAtualLabel = `${String(parcelaAtualNum).padStart(2,'0')}/${String(parcelas).padStart(2,'0')}`;
  const emAtraso = !!c.emAtraso && !quitada; // marcação manual — o sistema não presume atraso sozinho
  // mês/situação de cada parcela individual (competência): prevista, paga ou atrasada
  const mesesParcelas = [];
  for(let i=0;i<parcelas;i++){
    const numero = i+1;
    const mes = addMonths(mesCompra+'-01', i).slice(0,7);
    let situacaoParcela;
    if(numero < parcelaAtualNum || quitada) situacaoParcela = 'Paga';
    else situacaoParcela = 'Prevista'; // parcela do mês atual ou futura — chegada do mês não implica pagamento confirmado
    if(emAtraso && numero <= parcelaAtualNum) situacaoParcela = 'Atrasada';
    mesesParcelas.push({numero, label:`${String(numero).padStart(2,'0')}/${String(parcelas).padStart(2,'0')}`, mes, situacao:situacaoParcela});
  }
  const ultimaParcelaMes = mesesParcelas.length ? mesesParcelas[mesesParcelas.length-1].mes : mesCompra;
  const tipo = parcelas<=1 ? 'À vista' : 'Parcelada';
  const situacao = emAtraso ? 'Atrasada' : (quitada ? 'Finalizada' : 'Em aberto');
  const situacaoParcelaAtual = mesesParcelas[parcelaAtualNum-1] ? mesesParcelas[parcelaAtualNum-1].situacao : 'Paga';
  return {parcelas, valorParcela, parcelasPagas, parcelasRestantes, comprometimentoFuturo, quitada, emAtraso,
    parcelaAtualNum, parcelaAtualLabel, situacaoParcelaAtual, mesesParcelas, ultimaParcelaMes, tipo, situacao, valorTotal: parseNum(c.valorTotal)};
}

function cartaoFaturaAtual(cartaoId){
  return DB.comprasCartao.filter(c=>c.cartaoId===cartaoId).reduce((s,c)=>{
    const info = compraCartaoInfo(c);
    return s + (info.quitada?0:info.valorParcela);
  },0);
}
function cartaoComprometimentoFuturo(cartaoId){
  return DB.comprasCartao.filter(c=>c.cartaoId===cartaoId).reduce((s,c)=> s + compraCartaoInfo(c).comprometimentoFuturo, 0);
}
function cartaoLimiteUsado(cartaoId){
  return DB.comprasCartao.filter(c=>c.cartaoId===cartaoId).reduce((s,c)=> s + compraCartaoInfo(c).comprometimentoFuturo, 0);
}

// --- despesa: valor devido no mês corrente (considera parcelamento) ---
function despesaValorMesAtual(d){
  if(d.parcelado){
    const info = despesaParcelaInfo(d);
    return info.quitada ? 0 : info.valorParcela;
  }
  return parseNum(d.valor);
}
function despesaParcelaInfo(d){
  const parcelas = Math.max(1, parseInt(d.quantidadeParcelas)||1);
  const valorParcela = d.valorParcela ? parseNum(d.valorParcela) : round2(parseNum(d.valor)/parcelas);
  const mesCompra = monthKey(d.data) || thisMonthKey();
  const mesAtual = thisMonthKey();
  const decorridos = Math.max(0, monthsDiff(mesCompra, mesAtual));
  const parcelasPagas = Math.min(parcelas, decorridos);
  const parcelasRestantes = Math.max(0, parcelas - parcelasPagas);
  return {parcelas, valorParcela, parcelasPagas, parcelasRestantes, comprometimentoFuturo: round2(parcelasRestantes*valorParcela), quitada: parcelasRestantes<=0};
}

function moradiaTotalMensal(){
  return DB.moradia.reduce((s,m)=>s+parseNum(m.valor),0);
}

function entradasDoMes(mk){
  mk = mk || thisMonthKey();
  return DB.entradas.filter(e=>monthKey(e.data)===mk);
}
function totalEntradasMes(mk){
  return entradasDoMes(mk).reduce((s,e)=>s+parseNum(e.valorLiquido!==undefined&&e.valorLiquido!==''?e.valorLiquido:(parseNum(e.valorBruto)-parseNum(e.custos))),0);
}
function rendaMediaMensal(){
  // média dos últimos meses com dados (entradas + renda variável)
  const meses = new Set();
  DB.entradas.forEach(e=>meses.add(monthKey(e.data)));
  DB.rendaVariavel.forEach(r=>meses.add(monthKey(r.data)));
  if(meses.size===0) return 0;
  let total=0;
  meses.forEach(mk=>{ total += totalEntradasMes(mk) + totalRendaVariavelMes(mk); });
  return total/meses.size;
}
function totalRendaVariavelMes(mk){
  mk = mk || thisMonthKey();
  return DB.rendaVariavel.filter(r=>monthKey(r.data)===mk).reduce((s,r)=>{
    const lucro = parseNum(r.faturamento) - parseNum(r.combustivel) - parseNum(r.outrosCustos);
    return s+lucro;
  },0);
}

function despesasFixasMes(mk){
  mk = mk || thisMonthKey();
  const gerais = DB.despesas.filter(d=>d.tipo==='FIXA' && !d.parcelado).reduce((s,d)=>s+parseNum(d.valor),0);
  return gerais + moradiaTotalMensal();
}
function despesasVariaveisMes(mk){
  mk = mk || thisMonthKey();
  return DB.despesas.filter(d=>d.tipo==='VARIÁVEL' && monthKey(d.data)===mk && !d.parcelado).reduce((s,d)=>s+parseNum(d.valor),0);
}
function despesasExtraordinariasMes(mk){
  mk = mk || thisMonthKey();
  return DB.despesas.filter(d=>d.tipo==='EXTRAORDINÁRIA' && monthKey(d.data)===mk).reduce((s,d)=>s+parseNum(d.valor),0);
}
function despesasParceladasMesAtual(){
  return DB.despesas.filter(d=>d.parcelado).reduce((s,d)=>s+despesaValorMesAtual(d),0);
}
function totalFaturasCartoesMes(){
  return DB.cartoes.reduce((s,c)=>s+cartaoFaturaAtual(c.id),0);
}
function totalParcelasDividasMes(){
  return DB.dividas.reduce((s,d)=> s + (parseNum(d.parcelasRestantes ?? (parseInt(d.qtdParcelas||0)-parseInt(d.parcelasPagas||0))) > 0 ? parseNum(d.valorParcela) : 0), 0);
}
function totalDividasSaldoDevedor(){
  return DB.dividas.reduce((s,d)=>s+parseNum(d.saldoDevedor),0);
}
function totalComprometimentoFuturoCartoes(){
  return DB.cartoes.reduce((s,c)=>s+cartaoComprometimentoFuturo(c.id),0);
}
function totalComprometimentoFuturoParcelamentos(){
  return DB.despesas.filter(d=>d.parcelado).reduce((s,d)=>s+despesaParcelaInfo(d).comprometimentoFuturo,0);
}

// valor total comprometido no mês (saídas obrigatórias)
function valorComprometidoMes(){
  return despesasFixasMes() + despesasVariaveisMes() + despesasParceladasMesAtual() + totalFaturasCartoesMes() + totalParcelasDividasMes();
}

function saldoDisponivelMes(){
  return totalEntradasMes() + totalRendaVariavelMes() - valorComprometidoMes();
}

function comprometimentoRenda(){
  const renda = rendaMediaMensal() || totalEntradasMes()+totalRendaVariavelMes();
  if(renda<=0) return 0;
  return (valorComprometidoMes()/renda)*100;
}

function appInfo(a){
  const bruta = parseNum(a.receitaBruta);
  const taxas = parseNum(a.taxas);
  const liquida = round2(bruta - taxas);
  const km = parseNum(a.km);
  const horas = parseNum(a.horas);
  const combustivel = parseNum(a.combustivel);
  const manutencao = parseNum(a.manutencao);
  const outras = parseNum(a.outrasDespesas);
  const custosTotal = combustivel + manutencao + outras;
  const lucroLiquido = round2(liquida - custosTotal);
  const receitaPorKm = km>0 ? round2(liquida/km) : 0;
  const custoPorKm = km>0 ? round2(custosTotal/km) : 0;
  const lucroPorKm = km>0 ? round2(lucroLiquido/km) : 0;
  const receitaPorHora = horas>0 ? round2(liquida/horas) : 0;
  const lucroPorHora = horas>0 ? round2(lucroLiquido/horas) : 0;
  return {bruta, taxas, liquida, km, horas, custosTotal, lucroLiquido, receitaPorKm, custoPorKm, lucroPorKm, receitaPorHora, lucroPorHora};
}
// ---- Cálculo automático de horas trabalhadas (Hora Inicial + Hora Final - Intervalo) ----
function parseHoraMin(v){
  if(!v) return null;
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(v).trim());
  if(!m) return null;
  const h = parseInt(m[1],10), mi = parseInt(m[2],10);
  if(h<0||h>23||mi<0||mi>59) return null;
  return h*60+mi;
}
function horasDecParaTexto(dec){
  if(!dec || dec<=0) return '0h00';
  const totalMin = Math.round(dec*60);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return h+'h'+String(m).padStart(2,'0');
}
// Retorna {ok:true, totalMin, intervMin, efetivoMin, horasDecimais} ou {ok:false, error}
function calcularHorasEfetivas(horaIni, horaFim, intervalo){
  const iniMin = parseHoraMin(horaIni);
  const fimMin = parseHoraMin(horaFim);
  if(iniMin===null || fimMin===null) return {ok:false, error:'Informe hora inicial e hora final no formato HH:MM.'};
  let totalMin = fimMin - iniMin;
  if(totalMin <= 0) totalMin += 24*60; // hora final menor/igual à inicial => trabalho passou da meia-noite
  let intervMin = 0;
  if(intervalo){
    intervMin = parseHoraMin(intervalo);
    if(intervMin===null) return {ok:false, error:'Intervalo inválido. Use o formato HH:MM.'};
  }
  if(intervMin > totalMin) return {ok:false, error:'O intervalo não pode ser maior que o período trabalhado.'};
  const efetivoMin = totalMin - intervMin;
  if(efetivoMin < 0) return {ok:false, error:'O resultado das horas trabalhadas não pode ser negativo.'};
  const horasDecimais = Math.round((efetivoMin/60)*10000)/10000; // precisão alta p/ Receita/hora e Lucro/hora corretos
  return {ok:true, totalMin, intervMin, efetivoMin, horasDecimais};
}
function appsFiltrados(filtroApp, dataIni, dataFim){
  return DB.apps.filter(a=>{
    if(filtroApp && filtroApp!=='Todos' && a.app!==filtroApp) return false;
    if(dataIni && a.data < dataIni) return false;
    if(dataFim && a.data > dataFim) return false;
    return true;
  });
}
function appsResumoMes(mk){
  mk = mk || thisMonthKey();
  const rows = DB.apps.filter(a=>monthKey(a.data)===mk);
  const soma = (campo)=>rows.reduce((s,a)=>s+parseNum(a[campo]),0);
  const receitaBruta = soma('receitaBruta'), taxas = soma('taxas');
  const receitaLiquida = round2(receitaBruta-taxas);
  const despesas = soma('combustivel')+soma('manutencao')+soma('outrasDespesas');
  const lucroLiquido = round2(receitaLiquida-despesas);
  const km = soma('km'), horas = soma('horas');
  return {receitaBruta, taxas, receitaLiquida, despesas, lucroLiquido, km, horas,
    custoMedioKm: km>0?round2(despesas/km):0, receitaMediaKm: km>0?round2(receitaLiquida/km):0, receitaMediaHora: horas>0?round2(receitaLiquida/horas):0};
}
function appsLucroLiquidoMes(mk){ return appsResumoMes(mk).lucroLiquido; }
function appsReceitaBrutaMes(mk){ return appsResumoMes(mk).receitaBruta; }

/* ======================================================================
   MOTOR: DÍZIMO (regra global — 10% do dinheiro efetivamente recebido)
   Calculado sobre o valor BRUTO recebido, identificado por origem, sem duplicar.
====================================================================== */
function entradasRecebidasBrutoMes(mk){
  mk = mk || thisMonthKey();
  // apenas entradas manuais marcadas como recebidas e cuja fonte não seja Corretagem/Apps
  // (essas têm módulos próprios, evitando contar o mesmo dinheiro duas vezes)
  const origensExclusivas = ['corretagem','uber','99','ifood','giross'];
  return DB.entradas.filter(e=>{
    if(!e.recebido) return false;
    const mkr = monthKey(e.dataRecebimento || e.data);
    if(mkr!==mk) return false;
    const fonte = (e.fonte||'').toLowerCase();
    if(origensExclusivas.some(o=>fonte.includes(o))) return false; // já contabilizado via Corretagem/Apps
    return true;
  }).reduce((s,e)=>s+parseNum(e.valorBruto!==undefined?e.valorBruto:e.valorLiquido),0);
}
function totalEntradasBrutasRecebidasMes(mk){
  mk = mk || thisMonthKey();
  return entradasRecebidasBrutoMes(mk) + appsReceitaBrutaMes(mk) + corretagemRecebidaMes(mk);
}
function dizimoPercentualAtivo(){ return DB.config.dizimoAtivo!==false ? (parseNum(DB.config.dizimoPercentual)||0) : 0; }
function dizimoDoMes(mk){
  mk = mk || thisMonthKey();
  return round2(totalEntradasBrutasRecebidasMes(mk) * (dizimoPercentualAtivo()/100));
}
function entradasDisponiveisMes(mk){
  mk = mk || thisMonthKey();
  return round2(totalEntradasBrutasRecebidasMes(mk) - dizimoDoMes(mk));
}
// saldo disponível considerando o dízimo já reservado (usado no Dashboard/Relatórios — NÃO substitui saldoDisponivelMes original)
function saldoDisponivelComDizimoMes(mk){
  mk = mk || thisMonthKey();
  return round2(entradasDisponiveisMes(mk) - valorComprometidoMes());
}

function statusFinanceiro(){
  const c = comprometimentoRenda();
  if(c===0 && rendaMediaMensal()===0) return {emoji:'⚪',label:'SEM DADOS SUFICIENTES',cls:'st-purple',desc:'Cadastre suas receitas e despesas para receber um diagnóstico.'};
  if(c<50) return {emoji:'🟢',label:'CONTROLADO',cls:'st-green',desc:'Seu comprometimento de renda está em nível saudável.'};
  if(c<70) return {emoji:'🟡',label:'ATENÇÃO',cls:'st-yellow',desc:'Seu comprometimento está subindo. É hora de monitorar de perto.'};
  if(c<90) return {emoji:'🟠',label:'ENDIVIDAMENTO ELEVADO',cls:'st-orange',desc:'Grande parte da sua renda já está comprometida com despesas e dívidas.'};
  if(c<110) return {emoji:'🔴',label:'CRÍTICO',cls:'st-red',desc:'Seus compromissos consomem quase toda ou toda a sua renda.'};
  return {emoji:'🚨',label:'RISCO FINANCEIRO',cls:'st-red',desc:'Seus compromissos superam sua renda. Ação imediata é necessária.'};
}

// --- score de prioridade de dívidas ---
function dividaScore(d){
  let score = 0;
  const juros = parseNum(d.juros);
  const atraso = parseInt(d.diasAtraso)||0;
  const parcela = parseNum(d.valorParcela);
  const saldo = parseNum(d.saldoDevedor);
  const risco = d.riscoNegativacao ? 1 : 0;
  const essencial = d.riscoCorteEssencial ? 1 : 0;

  score += Math.min(30, juros*1.2);           // juros pesam até 30 pts
  score += Math.min(25, atraso*0.8);           // atraso pesa até 25 pts
  score += risco ? 15 : 0;                      // risco de negativação
  score += essencial ? 15 : 0;                   // corte de serviço essencial (água, luz)
  const renda = rendaMediaMensal()||1;
  score += Math.min(15, (parcela/renda)*100*0.4); // impacto no orçamento mensal
  return Math.round(score);
}
function dividaNivel(score){
  if(score>=65) return {label:'PRIORIDADE MÁXIMA', emoji:'🔴', cls:'st-red'};
  if(score>=45) return {label:'ALTA', emoji:'🟠', cls:'st-orange'};
  if(score>=25) return {label:'MÉDIA', emoji:'🟡', cls:'st-yellow'};
  return {label:'BAIXA', emoji:'🟢', cls:'st-green'};
}
function dividaMotivo(d, score){
  const parts = [];
  if(d.atrasada) parts.push(`está em atraso há ${d.diasAtraso||0} dia(s)`);
  if(parseNum(d.juros)>0) parts.push(`possui juros de ${pct(parseNum(d.juros))} ao mês`);
  if(d.riscoNegativacao) parts.push('tem risco de negativação');
  if(d.riscoCorteEssencial) parts.push('pode causar corte de um serviço essencial');
  parts.push(`sua quitação liberaria ${BRL(parseNum(d.valorParcela))}/mês do seu orçamento`);
  return `Esta dívida ${parts.join(', ')}.`;
}
function dividasComScore(){
  return DB.dividas.map(d=>{
    const score = dividaScore(d);
    return Object.assign({}, d, {score, nivel: dividaNivel(score), motivo: dividaMotivo(d,score)});
  }).sort((a,b)=>b.score-a.score);
}

// --- Índice de Saúde Financeira 0-100 ---
function saudeFinanceiraScore(){
  let score = 100;
  const fatores = [];
  const c = comprometimentoRenda();
  if(c>110){ score-=40; fatores.push('Comprometimento da renda acima de 110%'); }
  else if(c>90){ score-=30; fatores.push('Comprometimento da renda acima de 90%'); }
  else if(c>70){ score-=18; fatores.push('Comprometimento da renda acima de 70%'); }
  else if(c>50){ score-=8; fatores.push('Comprometimento da renda acima de 50%'); }

  const atrasadas = DB.dividas.filter(d=>d.atrasada).length;
  if(atrasadas>0){ score -= Math.min(20, atrasadas*7); fatores.push(`${atrasadas} dívida(s) em atraso`); }

  const dividasCount = DB.dividas.length;
  if(dividasCount>=5){ score-=10; fatores.push('Número elevado de dívidas ativas (5 ou mais)'); }
  else if(dividasCount>=3){ score-=5; fatores.push('Várias dívidas ativas simultâneas'); }

  const limiteMedioUsado = cartoesPercentualMedioLimite();
  if(limiteMedioUsado>80){ score-=10; fatores.push('Limite dos cartões quase totalmente utilizado'); }
  else if(limiteMedioUsado>50){ score-=5; fatores.push('Uso elevado do limite dos cartões'); }

  const saldo = saldoDisponivelMes();
  if(saldo<0){ score-=15; fatores.push('Saldo do mês projetado como negativo'); }

  if(parseNum(DB.config.saldoAtual)<=0 && DB.entradas.length>0){ score-=5; fatores.push('Ausência de reserva financeira'); }

  score = Math.max(0, Math.min(100, Math.round(score)));
  let faixa;
  if(score>=90) faixa={label:'Excelente', cls:'st-green'};
  else if(score>=75) faixa={label:'Boa', cls:'st-green'};
  else if(score>=60) faixa={label:'Atenção', cls:'st-yellow'};
  else if(score>=40) faixa={label:'Frágil', cls:'st-orange'};
  else if(score>=20) faixa={label:'Crítica', cls:'st-red'};
  else faixa={label:'Emergência', cls:'st-red'};
  return {score, faixa, fatores};
}
function cartoesPercentualMedioLimite(){
  const cs = DB.cartoes.filter(c=>parseNum(c.limite)>0);
  if(cs.length===0) return 0;
  const total = cs.reduce((s,c)=> s + Math.min(100,(cartaoLimiteUsado(c.id)/parseNum(c.limite))*100), 0);
  return total/cs.length;
}

// dados mínimos ausentes p/ diagnóstico confiável
function dadosFaltando(){
  const faltando = [];
  if(DB.entradas.length===0 && DB.rendaVariavel.length===0) faltando.push('Nenhuma receita cadastrada (Entradas ou Renda Variável)');
  if(DB.despesas.length===0 && DB.moradia.length===0) faltando.push('Nenhuma despesa cadastrada (Despesas ou Moradia)');
  DB.dividas.forEach(d=>{ if(!d.juros && d.juros!==0) faltando.push(`Dívida "${d.credor||'sem nome'}": juros não informado`); });
  return faltando;
}

  const gDiz = document.createElement('div'); gDiz.className='grid grid-4 section';
  gDiz.innerHTML = kpiCard('Entradas brutas recebidas', BRL(brutoRecebido)) + kpiCard('Dízimo reservado', BRL(dizimo)) +
    kpiCard('Entradas disponíveis', BRL(disponivel)) + kpiCard('Despesas (mês)', BRL(desp));
  main.appendChild(gDiz);
  const gDiz2 = document.createElement('div'); gDiz2.className='grid grid-2 section';
  gDiz2.innerHTML = kpiCard('Saldo disponível (após dízimo e despesas)', BRL(saldoDisponivelComDizimoMes(mk)), saldoDisponivelComDizimoMes(mk)>=0?'pos':'neg') +
    kpiCard('% do dízimo aplicado', pct(dizimoPercentualAtivo(),0));

  const gMod = document.createElement('div'); gMod.className='grid grid-4 section';

  if(evitar.length===0) evitar.push('Nenhum alerta crítico — mantenha a disciplina de sempre.');
  avoidCard.innerHTML += evitar.map(e=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-dim);">⛔ ${e}</div>`).join('');
  sec2.appendChild(avoidCard);
  main.appendChild(sec2);

  // saúde financeira mini
  const sf = saudeFinanceiraScore();
  const sec3 = document.createElement('div'); sec3.className='card section';
  sec3.innerHTML = `<div class="hero-score">
    <div class="score-ring" style="background:conic-gradient(${scoreColor(sf.score)} ${sf.score*3.6}deg, var(--bg) 0deg); ">

    <p style="color:var(--text-dim);font-size:12.5px;margin-top:6px;">${sf.fatores.length? 'Fatores reduzindo o score: '+sf.fatores.join('; ')+'.' : 'Nenhum fator negativo identificado no momento.'}</p></div>
  </div>`;
  main.appendChild(sec3);
}
function scoreColor(s){ return s>=75?'#22c55e':s>=50?'#eab308':s>=30?'#f97316':'#ef4444'; }
function kpiCard(label,value,cls){
  return `<div class="card kpi"><div class="label">${label}</div><div class="value mono ${cls||''}">${value}</div></div>`;
}

function gerarAcoesPrioritarias(){
  const acoes = [];
  const topDivida = dividasComScore()[0];
  if(topDivida && topDivida.score>=45){
    acoes.push({titulo:`Priorizar dívida: ${topDivida.credor||'sem nome'}`, detalhe: topDivida.motivo});
  }
  const atrasadas = DB.dividas.filter(d=>d.atrasada);
  atrasadas.slice(0,2).forEach(d=>{
    if(!topDivida || d.id!==topDivida.id) acoes.push({titulo:`Negociar dívida atrasada: ${d.credor||'sem nome'}`, detalhe:`Está atrasada há ${d.diasAtraso||0} dia(s), com risco de agravamento.`});
  });
  const cartaoAlto = DB.cartoes.find(c=>parseNum(c.limite)>0 && (cartaoLimiteUsado(c.id)/parseNum(c.limite))>0.85);
  if(cartaoAlto) acoes.push({titulo:`Evitar uso do cartão ${cartaoAlto.nome}`, detalhe:'Limite quase totalmente utilizado — novo uso aumenta o risco de descontrole.'});
  const saldo = saldoDisponivelMes();
  if(saldo<0) acoes.push({titulo:'Reduzir despesas variáveis este mês', detalhe:`Seu saldo projetado está negativo em ${BRL(Math.abs(saldo))}.`});
  const comp = comprometimentoRenda();
  if(comp>90) acoes.push({titulo:'Buscar renda adicional', detalhe:`Seu comprometimento de renda está em ${pct(comp)}. Uma fonte extra pode aliviar o orçamento rapidamente.`});
  return acoes.slice(0,6);
}

    if(rv>0) DB.rendaVariavel.push({id:uid(),app:'Renda variável (cadastro inicial)',data:todayISO(),horas:0,faturamento:rv,combustivel:0,outrosCustos:0,obs:'Criado pelo assistente de primeiro acesso'});
    if(desp>0) DB.despesas.push({id:uid(),data:todayISO(),descricao:'Despesas essenciais (cadastro inicial)',categoria:'Outros',subcategoria:'',tipo:'FIXA',valor:desp,formaPagamento:'Débito',parcelado:false,status:'Pendente',obs:'Criado pelo assistente de primeiro acesso'});

    DB.meta.primeiroAcessoFeito = true;
    saveDB(); closeModal(); toast('Diagnóstico inicial criado!'); navigate('dashboard');
  };
}

function entradaForm(id){
  const e = id ? DB.entradas.find(x=>x.id===id) : {};
  openModal(id?'Editar entrada':'Nova entrada', `
    <div class="form-grid">
      <div class="field"><label>Data</label><input id="fData" type="date" value="${e.data||todayISO()}"></div>
      <div class="field"><label>Descrição</label><input id="fDesc" type="text" value="${e.descricao||''}"></div>
      <div class="field"><label>Fonte</label><input id="fFonte" list="fontesList" type="text" value="${e.fonte||''}"></div>
      <datalist id="fontesList"><option>CLT / salário</option><option>Uber</option><option>99</option><option>iFood</option><option>Outros aplicativos</option><option>Corretagem</option><option>Comissão</option><option>Aluguel</option><option>Trabalho extra</option><option>Outros</option></datalist>
      <div class="field"><label>Categoria</label><input id="fCat" type="text" value="${e.categoria||''}"></div>
      <div class="field"><label>Tipo</label><select id="fTipo"><option ${e.tipo==='Fixa'?'selected':''}>Fixa</option><option ${e.tipo==='Variável'?'selected':''}>Variável</option><option ${e.tipo==='Extraordinária'?'selected':''}>Extraordinária</option></select></div>
      <div class="field"><label>Valor bruto (R$)</label><input id="fBruto" type="text" inputmode="decimal" value="${e.valorBruto??''}"></div>
      <div class="field"><label>Custos (R$)</label><input id="fCustos" type="text" inputmode="decimal" value="${e.custos??''}"></div>
      <div class="field chk"><input id="fRecebido" type="checkbox" ${e.recebido?'checked':''}><label>Já recebido?</label></div>
      <div class="field"><label>Data de recebimento</label><input id="fDataRec" type="date" value="${e.dataRecebimento||''}"></div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Observação</label><textarea id="fObs">${e.obs||''}</textarea></div>
    <div class="form-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="saveBtn">Salvar</button></div>
  `);
  document.getElementById('saveBtn').onclick = ()=>{
    const bruto = parseNum(document.getElementById('fBruto').value);
    const custos = parseNum(document.getElementById('fCustos').value);
    const obj = {
      id: id||uid(), data: document.getElementById('fData').value||todayISO(),
      descricao: document.getElementById('fDesc').value, fonte: document.getElementById('fFonte').value,
      categoria: document.getElementById('fCat').value, tipo: document.getElementById('fTipo').value,
      valorBruto: bruto, custos: custos, valorLiquido: bruto-custos,
      recebido: document.getElementById('fRecebido').checked, dataRecebimento: document.getElementById('fDataRec').value,
      obs: document.getElementById('fObs').value
    };
    if(!obj.descricao){ toast('Informe uma descrição.', true); return; }
    upsert('entradas', obj);
    upsertMovimentacaoPorOrigem('entradas', obj.id, {
      data: obj.data, tipo:'Entrada', valor: parseNum(obj.valorLiquido),
      categoria: obj.categoria || obj.tipo || '', origem: obj.fonte || '',
      descricao: obj.descricao || '', observacoes: obj.obs || '',
      status: obj.recebido ? 'Recebido' : 'Pendente'
    });
    saveDB();
    closeModal(); toast('Entrada salva.'); render();
  };
}

    <tbody>${rows.length? rows.map(c=>{
      const pendente = Math.max(0, parseNum(c.valorBrutoComissao)-parseNum(c.valorRecebido));
      return `<tr><td>${fmtDate(c.data)}</td><td>${esc(c.cliente)||'—'}</td><td>${esc(c.imovel)||'—'}</td><td>${esc(c.empreendimento)||'—'}</td>
      <td class="mono">${BRL(parseNum(c.valorImovel))}</td><td class="mono">${BRL(parseNum(c.valorBrutoComissao))}</td>
      <td class="mono pos">${BRL(parseNum(c.valorRecebido))}</td><td class="mono ${pendente>0?'neg':''}">${BRL(pendente)}</td>
      <td><span class="tag">${esc(c.status)}</span></td>
      <td><div class="row-actions"><button class="btn btn-sm btn-ghost" onclick="corretagemForm('${c.id}')">Editar</button><button class="btn btn-sm btn-danger" onclick="deleteItem('corretagem','${c.id}')">Excluir</button></div></td></tr>`;
    }).join('') : `<tr class="empty-row"><td colspan="10">Nenhuma venda cadastrada ainda.</td></tr>`}</tbody></table>`;

function corretagemForm(id){
  const c = id? DB.corretagem.find(x=>x.id===id) : {};
  openModal(id?'Editar venda/comissão':'Nova venda/comissão', `
    <div class="form-grid">
      <div class="field"><label>Data da venda</label><input id="fData" type="date" value="${c.data||todayISO()}"></div>
      <div class="field"><label>Cliente</label><input id="fCliente" type="text" value="${esc(c.cliente)||''}"></div>
      <div class="field"><label>Imóvel</label><input id="fImovel" type="text" value="${esc(c.imovel)||''}"></div>
      <div class="field"><label>Empreendimento</label><input id="fEmp" type="text" value="${esc(c.empreendimento)||''}"></div>
      <div class="field"><label>Valor do imóvel (R$)</label><input id="fValorImovel" type="text" inputmode="decimal" value="${c.valorImovel??''}"></div>
      <div class="field"><label>Percentual da comissão (%)</label><input id="fPct" type="text" inputmode="decimal" value="${c.percentualComissao??''}"></div>
      <div class="field"><label>Valor bruto da comissão (R$)</label><input id="fBrutoCom" type="text" inputmode="decimal" value="${c.valorBrutoComissao??''}"></div>
      <div class="field"><label>Valor recebido (R$)</label><input id="fRecebido" type="text" inputmode="decimal" value="${c.valorRecebido??'0'}"></div>
      <div class="field"><label>Data prevista de recebimento</label><input id="fDataPrev" type="date" value="${c.dataPrevistaRecebimento||''}"></div>
      <div class="field"><label>Data do recebimento</label><input id="fDataRec" type="date" value="${c.dataRecebimento||''}"></div>
      <div class="field"><label>Forma de recebimento</label><input id="fForma" type="text" value="${esc(c.formaRecebimento)||''}"></div>
      <div class="field"><label>Status</label><select id="fStatus">${STATUS_CORRETAGEM.map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Observações</label><textarea id="fObs">${esc(c.observacoes)||''}</textarea></div>
    <div class="form-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="saveBtn">Salvar</button></div>
  `);
  // auto-calcula comissão bruta a partir do % se o campo de comissão bruta estiver vazio
  const elValorImovel = document.getElementById('fValorImovel'), elPct = document.getElementById('fPct'), elBruto = document.getElementById('fBrutoCom');
  function autoCalc(){
    const vi = parseNum(elValorImovel.value), p = parseNum(elPct.value);
    if(vi>0 && p>0 && !elBruto.dataset.userEdited) elBruto.value = round2(vi*p/100);
  }
  elBruto.addEventListener('input', ()=>{ elBruto.dataset.userEdited='1'; });
  elValorImovel.addEventListener('input', autoCalc); elPct.addEventListener('input', autoCalc);

  document.getElementById('saveBtn').onclick = ()=>{
    const obj = {
      id:id||uid(), data:document.getElementById('fData').value||todayISO(), cliente:document.getElementById('fCliente').value,
      imovel:document.getElementById('fImovel').value, empreendimento:document.getElementById('fEmp').value,
      valorImovel:parseNum(document.getElementById('fValorImovel').value), percentualComissao:parseNum(document.getElementById('fPct').value),
      valorBrutoComissao:parseNum(document.getElementById('fBrutoCom').value), valorRecebido:parseNum(document.getElementById('fRecebido').value),
      dataPrevistaRecebimento:document.getElementById('fDataPrev').value, dataRecebimento:document.getElementById('fDataRec').value,
      formaRecebimento:document.getElementById('fForma').value, status:document.getElementById('fStatus').value,
      observacoes:document.getElementById('fObs').value
    };
    if(!obj.cliente){ toast('Informe o cliente.', true); return; }
    if(obj.valorRecebido>0 && !obj.dataRecebimento) obj.dataRecebimento = todayISO();
    upsert('corretagem', obj);
    // Regra de negócio: só a comissão efetivamente recebida vira dinheiro no financeiro central.
    upsertMovimentacaoPorOrigem('corretagem', obj.id, {
      data: obj.dataRecebimento || obj.data, tipo:'Entrada', valor: parseNum(obj.valorRecebido),
      categoria:'Corretagem', origem: obj.cliente || '',
      descricao: 'Comissão — ' + (obj.imovel||obj.cliente||''), observacoes: obj.observacoes || '',
      status: parseNum(obj.valorRecebido)>0 ? 'Recebido' : 'Pendente'
    });
    saveDB();
    closeModal(); toast('Venda/comissão salva.'); render();
  };
}

const LISTA_APPS = ['Uber','99','iFood','Giross','Outros'];
function renderApps(main){
  pageHeader(main, 'Apps', 'Controle operacional diário de renda por aplicativo: KM, horas, custos e lucro real.');

  const rMes = appsResumoMes();
  const g = document.createElement('div'); g.className='grid grid-4 section';
  g.innerHTML = kpiCard('Receita bruta (mês)', BRL(rMes.receitaBruta)) + kpiCard('Receita líquida (mês)', BRL(rMes.receitaLiquida)) +
    kpiCard('Despesas (mês)', BRL(rMes.despesas)) + kpiCard('Lucro líquido (mês)', BRL(rMes.lucroLiquido), rMes.lucroLiquido>=0?'pos':'neg');
  main.appendChild(g);
  const g2 = document.createElement('div'); g2.className='grid grid-4 section';
  g2.innerHTML = kpiCard('KM rodados (mês)', rMes.km.toLocaleString('pt-BR')+' km') + kpiCard('Custo médio/km', BRL(rMes.custoMedioKm)) +
    kpiCard('Receita média/km', BRL(rMes.receitaMediaKm)) + kpiCard('Receita média/hora', BRL(rMes.receitaMediaHora));
  main.appendChild(g2);

  // comparativo por app
  const porApp = {};
  DB.apps.forEach(a=>{
    const k = a.app||'Outros'; if(!porApp[k]) porApp[k] = {registros:0};
    porApp[k].registros++;
  });
  const nomesApp = Object.keys(porApp);
  if(nomesApp.length){
    const sec = document.createElement('div'); sec.className='section';
    sec.innerHTML = `<div class="section-head"><h2>Comparativo por aplicativo</h2></div>`;
    const wrap = document.createElement('div'); wrap.className='table-wrap';
    wrap.innerHTML = `<table><thead><tr><th>App</th><th>Receita líquida</th><th>Lucro líquido</th><th>KM</th><th>Lucro/km</th><th>Lucro/hora</th></tr></thead><tbody>
      ${nomesApp.map(k=>{
        const rows = DB.apps.filter(a=>(a.app||'Outros')===k);
        const liquida = rows.reduce((s,a)=>s+appInfo(a).liquida,0);
        const lucro = rows.reduce((s,a)=>s+appInfo(a).lucroLiquido,0);
        const km = rows.reduce((s,a)=>s+parseNum(a.km),0);
        const horas = rows.reduce((s,a)=>s+parseNum(a.horas),0);
        return `<tr><td>${esc(k)}</td><td class="mono">${BRL(liquida)}</td><td class="mono">${BRL(lucro)}</td><td class="mono">${km} km</td><td class="mono">${BRL(km>0?lucro/km:0)}</td><td class="mono">${BRL(horas>0?lucro/horas:0)}</td></tr>`;
      }).join('')}</tbody></table>`;
    sec.appendChild(wrap); main.appendChild(sec);
  }

  const head = document.createElement('div'); head.className='section-head'; head.innerHTML=`<h2>Registros diários</h2>`;
  const addBtn = document.createElement('button'); addBtn.className='btn btn-primary'; addBtn.textContent='+ Novo registro';
  addBtn.onclick = ()=>appForm(); head.appendChild(addBtn); main.appendChild(head);

  const filtros = document.createElement('div'); filtros.className='filters';
  filtros.innerHTML = `<select id="fApp"><option value="Todos">Todos os apps</option>${LISTA_APPS.map(a=>`<option>${a}</option>`).join('')}</select>
    <select id="fPeriodo"><option value="mes">Este mês</option><option value="semana">Últimos 7 dias</option><option value="tudo">Todo o período</option></select>`;
  main.appendChild(filtros);

  const wrap = document.createElement('div'); wrap.className='table-wrap';
  main.appendChild(wrap);
  function draw(){
    const app = document.getElementById('fApp').value;
    const periodo = document.getElementById('fPeriodo').value;
    let dataIni=null;
    if(periodo==='mes') dataIni = thisMonthKey()+'-01';
    if(periodo==='semana') dataIni = new Date(Date.now()-6*86400000).toISOString().slice(0,10);
    const rows = appsFiltrados(app, dataIni, null).slice().sort((a,b)=>b.data.localeCompare(a.data));
    wrap.innerHTML = `<table><thead><tr><th>Data</th><th>App</th><th>R. bruta</th><th>Taxas</th><th>R. líquida</th><th>KM</th><th>Horas</th><th>Custos</th><th>Lucro líq.</th><th>Lucro/km</th><th>Lucro/h</th><th></th></tr></thead><tbody>
    ${rows.length? rows.map(a=>{
      const i = appInfo(a);
      return `<tr><td>${fmtDate(a.data)}</td><td><span class="tag">${esc(a.app)}</span></td><td class="mono">${BRL(i.bruta)}</td><td class="mono">${BRL(i.taxas)}</td>
      <td class="mono">${BRL(i.liquida)}</td><td class="mono">${i.km||0}</td><td class="mono">${i.horas>0?horasDecParaTexto(i.horas):'0h00'}</td><td class="mono">${BRL(i.custosTotal)}</td>
      <td class="mono ${i.lucroLiquido>=0?'pos':'neg'}">${BRL(i.lucroLiquido)}</td><td class="mono">${BRL(i.lucroPorKm)}</td><td class="mono">${i.horas>0?BRL(i.lucroPorHora):'—'}</td>
      <td><div class="row-actions"><button class="btn btn-sm btn-ghost" onclick="appForm('${a.id}')">Editar</button><button class="btn btn-sm btn-danger" onclick="deleteItem('apps','${a.id}')">Excluir</button></div></td></tr>`;
    }).join('') : `<tr class="empty-row"><td colspan="12">Nenhum registro ainda.</td></tr>`}</tbody></table>`;
  }
  draw();
  ['fApp','fPeriodo'].forEach(idn=>document.getElementById(idn).addEventListener('change',draw));
}
function appForm(id){
  const a = id? DB.apps.find(x=>x.id===id) : {};
  openModal(id?'Editar registro':'Novo registro de app', `
    <div class="form-grid">
      <div class="field"><label>Data</label><input id="fData" type="date" value="${a.data||todayISO()}"></div>
      <div class="field"><label>Aplicativo</label><select id="fAppSel">${LISTA_APPS.map(l=>`<option ${a.app===l?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Receita bruta (R$)</label><input id="fBruta" type="text" inputmode="decimal" value="${a.receitaBruta??''}"></div>
      <div class="field"><label>Taxas/descontos (R$)</label><input id="fTaxas" type="text" inputmode="decimal" value="${a.taxas??'0'}"></div>
      <div class="field"><label>KM rodados</label><input id="fKm" type="text" inputmode="decimal" value="${a.km??''}"></div>
      <div class="field"><label>Horas trabalhadas (manual)</label><input id="fHoras" type="text" inputmode="decimal" value="${a.horas??''}"></div>
      <div class="field"><label>Combustível (R$)</label><input id="fComb" type="text" inputmode="decimal" value="${a.combustivel??'0'}"></div>
      <div class="field"><label>Manutenção (R$)</label><input id="fManut" type="text" inputmode="decimal" value="${a.manutencao??'0'}"></div>
      <div class="field"><label>Outras despesas (R$)</label><input id="fOutras" type="text" inputmode="decimal" value="${a.outrasDespesas??'0'}"></div>
    </div>
    <div class="section" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border,rgba(255,255,255,.08));">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;">Cálculo automático de horas trabalhadas</div>
      <div class="form-grid">
        <div class="field"><label>Hora inicial</label><input id="fHoraIni" type="time" value="${a.horaInicial||''}"></div>
        <div class="field"><label>Hora final</label><input id="fHoraFim" type="time" value="${a.horaFinal||''}"></div>
        <div class="field"><label>Intervalo (opcional)</label><input id="fIntervalo" type="time" value="${a.intervalo||''}"></div>
      </div>
      <div id="calcPreview" style="margin-top:6px;font-size:12.5px;min-height:18px;"></div>
      <div style="margin-top:4px;font-size:11.5px;color:var(--text-dim);">Preenchendo Hora inicial e Hora final, o sistema calcula as horas trabalhadas automaticamente (descontando o intervalo) e substitui o campo manual acima. Deixe as duas em branco para continuar usando o campo manual.</div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Observações</label><textarea id="fObs">${esc(a.observacoes)||''}</textarea></div>
    <div class="form-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="saveBtn">Salvar</button></div>
  `);
  function updateCalcPreview(){
    const hi = document.getElementById('fHoraIni').value;
    const hf = document.getElementById('fHoraFim').value;
    const iv = document.getElementById('fIntervalo').value;
    const prev = document.getElementById('calcPreview');
    if(!hi && !hf){ prev.innerHTML = ''; return; }
    const r = calcularHorasEfetivas(hi, hf, iv);
    if(!r.ok){ prev.innerHTML = `<span style="color:#e05252;">${esc(r.error)}</span>`; return; }
    prev.innerHTML = `Tempo total: <strong>${horasDecParaTexto(r.totalMin/60)}</strong> · Intervalo: <strong>${r.intervMin} min</strong> · Horas efetivamente trabalhadas: <strong>${horasDecParaTexto(r.horasDecimais)}</strong>`;
  }
  ['fHoraIni','fHoraFim','fIntervalo'].forEach(idn=>document.getElementById(idn).addEventListener('input', updateCalcPreview));
  updateCalcPreview();
  document.getElementById('saveBtn').onclick = ()=>{
    const horaIni = document.getElementById('fHoraIni').value;
    const horaFim = document.getElementById('fHoraFim').value;
    const intervalo = document.getElementById('fIntervalo').value;
    let horasFinal, horaIniSave, horaFimSave, intervaloSave;
    if(horaIni || horaFim){
      if(!horaIni || !horaFim){ toast('Preencha Hora inicial e Hora final juntas, ou deixe as duas em branco para usar o campo manual.', true); return; }
      const r = calcularHorasEfetivas(horaIni, horaFim, intervalo);
      if(!r.ok){ toast(r.error, true); return; }
      horasFinal = r.horasDecimais; horaIniSave = horaIni; horaFimSave = horaFim; intervaloSave = intervalo||'';
    } else {
      horasFinal = parseNum(document.getElementById('fHoras').value);
      horaIniSave = ''; horaFimSave = ''; intervaloSave = '';
    }
    const obj = {id:id||uid(), data:document.getElementById('fData').value||todayISO(), app:document.getElementById('fAppSel').value,
      receitaBruta:parseNum(document.getElementById('fBruta').value), taxas:parseNum(document.getElementById('fTaxas').value),
      km:parseNum(document.getElementById('fKm').value), horas:horasFinal,
      horaInicial:horaIniSave, horaFinal:horaFimSave, intervalo:intervaloSave,
      combustivel:parseNum(document.getElementById('fComb').value), manutencao:parseNum(document.getElementById('fManut').value),
      outrasDespesas:parseNum(document.getElementById('fOutras').value), observacoes:document.getElementById('fObs').value};
    upsert('apps', obj);
    const info = appInfo(obj);
    upsertMovimentacaoPorOrigem('apps', obj.id, {
      data: obj.data, tipo:'Entrada', valor: info.lucroLiquido,
      categoria:'Aplicativo', origem: obj.app || '',
      descricao: 'Corrida/turno ' + (obj.app||''), observacoes: obj.observacoes || '',
      status:'Recebido'
    });
    saveDB();
    closeModal(); toast('Registro salvo.'); render();
  };
}

function renderRendaVariavel(main){
  pageHeader(main, 'Renda Variável', 'Controle de aplicativos e trabalhos extras: identifique qual fonte é mais vantajosa.');

  const rows = DB.rendaVariavel.slice().sort((a,b)=>b.data.localeCompare(a.data));
  const totalLucro = rows.reduce((s,r)=>s+(parseNum(r.faturamento)-parseNum(r.combustivel)-parseNum(r.outrosCustos)),0);
  const totalHoras = rows.reduce((s,r)=>s+parseNum(r.horas),0);
  const lucroHora = totalHoras>0? totalLucro/totalHoras : 0;
  const g = document.createElement('div'); g.className='grid grid-3 section';
  g.innerHTML = kpiCard('Lucro líquido total', BRL(totalLucro)) + kpiCard('Lucro médio por hora', BRL(lucroHora)) + kpiCard('Lucro do mês atual', BRL(totalRendaVariavelMes()));
  main.appendChild(g);

  // ranking por app
  const apps = {};
  rows.forEach(r=>{
    const k = r.app||'Sem nome';
    if(!apps[k]) apps[k] = {faturamento:0,custos:0,horas:0,lucro:0};
    const lucro = parseNum(r.faturamento)-parseNum(r.combustivel)-parseNum(r.outrosCustos);
    apps[k].faturamento+=parseNum(r.faturamento); apps[k].custos+=parseNum(r.combustivel)+parseNum(r.outrosCustos);
    apps[k].horas+=parseNum(r.horas); apps[k].lucro+=lucro;
  });
  const appNames = Object.keys(apps);
  if(appNames.length){
    const sec = document.createElement('div'); sec.className='section';
    sec.innerHTML = `<div class="section-head"><h2>Comparativo por fonte</h2><span class="hint">Qual realmente vale mais a pena?</span></div>`;
    const wrap = document.createElement('div'); wrap.className='table-wrap';
    wrap.innerHTML = `<table><thead><tr><th>Fonte</th><th>Faturamento</th><th>Custos</th><th>Lucro líquido</th><th>Horas</th><th>Lucro/hora</th></tr></thead><tbody>
      ${appNames.sort((a,b)=>apps[b].lucro-apps[a].lucro).map(k=>{
        const a = apps[k]; const lh = a.horas>0?a.lucro/a.horas:0;
        return `<tr><td>${k}</td><td class="mono">${BRL(a.faturamento)}</td><td class="mono">${BRL(a.custos)}</td><td class="mono">${BRL(a.lucro)}</td><td class="mono">${a.horas}h</td><td class="mono">${BRL(lh)}</td></tr>`;
      }).join('')}</tbody></table>`;
    sec.appendChild(wrap);
    main.appendChild(sec);
  }

  const head = document.createElement('div'); head.className='section-head';
  head.innerHTML = `<h2>Registros</h2>`;
  const addBtn = document.createElement('button'); addBtn.className='btn btn-primary'; addBtn.textContent='+ Novo registro';
  addBtn.onclick = ()=>rendaVarForm();
  head.appendChild(addBtn);
  main.appendChild(head);

  const wrap = document.createElement('div'); wrap.className='table-wrap';
  wrap.innerHTML = `<table><thead><tr><th>Data</th><th>Fonte</th><th>Horas</th><th>Faturamento</th><th>Custos</th><th>Lucro</th><th>Lucro/h</th><th></th></tr></thead><tbody>
    ${rows.length? rows.map(r=>{
      const custos = parseNum(r.combustivel)+parseNum(r.outrosCustos);
      const lucro = parseNum(r.faturamento)-custos;
      const lh = parseNum(r.horas)>0? lucro/parseNum(r.horas):0;
      return `<tr><td>${fmtDate(r.data)}</td><td>${r.app||'—'}</td><td class="mono">${r.horas||0}h</td><td class="mono">${BRL(parseNum(r.faturamento))}</td><td class="mono">${BRL(custos)}</td><td class="mono">${BRL(lucro)}</td><td class="mono">${BRL(lh)}</td>
      <td><div class="row-actions"><button class="btn btn-sm btn-ghost" onclick="rendaVarForm('${r.id}')">Editar</button><button class="btn btn-sm btn-danger" onclick="deleteItem('rendaVariavel','${r.id}')">Excluir</button></div></td></tr>`;
    }).join('') : `<tr class="empty-row"><td colspan="8">Nenhum registro ainda.</td></tr>`}
  </tbody></table>`;
  main.appendChild(wrap);
}

function renderCartoes(main){
  pageHeader(main, 'Cartões', 'Cartões, compras e o comprometimento futuro que elas geram no seu orçamento.');

  // ---- Resumo e filtros consolidados de todas as compras (Seção 3) ----
  if(DB.comprasCartao.length){
    const totalAVista = DB.comprasCartao.filter(c=>(parseInt(c.parcelas)||1)<=1).reduce((s,c)=>s+parseNum(c.valorTotal),0);
    const totalParcelado = DB.comprasCartao.filter(c=>(parseInt(c.parcelas)||1)>1).reduce((s,c)=>s+parseNum(c.valorTotal),0);
    const totalComprometFuturo = DB.comprasCartao.reduce((s,c)=>s+compraCartaoInfo(c).comprometimentoFuturo,0);
    const gResumo = document.createElement('div'); gResumo.className='grid grid-3 section';
    gResumo.innerHTML = kpiCard('Compras à vista', BRL(totalAVista)) + kpiCard('Compras parceladas', BRL(totalParcelado)) + kpiCard('Comprometimento futuro', BRL(totalComprometFuturo));

    const secTodas = document.createElement('div'); secTodas.className='section';
    secTodas.innerHTML = `<div class="section-head"><h2>Todas as compras</h2><span class="hint">Filtre por tipo, situação, cartão ou categoria.</span></div>`;
    main.appendChild(secTodas);
    const categoriasUsadas = Array.from(new Set(DB.comprasCartao.map(c=>c.categoria).filter(Boolean)));
    const filtros = document.createElement('div'); filtros.className='filters';
    filtros.innerHTML = `<select id="fcTipo"><option value="">Tipo: Todas</option><option>À vista</option><option>Parcelada</option></select>
      <select id="fcSituacao"><option value="">Situação: Todas</option><option>Em aberto</option><option>Pagas</option><option>Finalizadas</option><option>Atrasadas</option></select>
      <select id="fcCartao"><option value="">Cartão: Todos</option>${DB.cartoes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select>
      <select id="fcCategoria"><option value="">Categoria: Todas</option>${categoriasUsadas.map(c=>`<option>${esc(c)}</option>`).join('')}</select>`;
    main.appendChild(filtros);
    const wrapTodas = document.createElement('div'); wrapTodas.className='table-wrap section';
    main.appendChild(wrapTodas);
    function drawTodas(){
      const ft = document.getElementById('fcTipo').value, fs = document.getElementById('fcSituacao').value;
      const fc = document.getElementById('fcCartao').value, fcat = document.getElementById('fcCategoria').value;
      let rows = DB.comprasCartao.map(c=>({c, info:compraCartaoInfo(c), cartao:DB.cartoes.find(x=>x.id===c.cartaoId)}));
      if(ft) rows = rows.filter(r=>r.info.tipo===ft);
      if(fs) rows = rows.filter(r=> fs==='Pagas' ? r.info.parcelasPagas>0 : (fs==='Atrasadas' ? r.info.emAtraso : r.info.situacao===fs));
      if(fc) rows = rows.filter(r=>r.c.cartaoId===fc);
      if(fcat) rows = rows.filter(r=>r.c.categoria===fcat);
      rows.sort((a,b)=>(b.c.data||'').localeCompare(a.c.data||''));
      wrapTodas.innerHTML = `<table><thead><tr><th>Data</th><th>Descrição</th><th>Cartão</th><th>Categoria</th><th>Tipo</th><th>Valor total</th><th>Parcela atual</th><th>Situação</th><th>Comprom. futuro</th></tr></thead><tbody>
        ${rows.length? rows.map(({c,info,cartao})=>`<tr><td>${fmtDate(c.data)}</td><td>${esc(c.descricao)}</td><td>${esc(cartao?cartao.nome:'—')}</td>
        <td><span class="tag">${esc(c.categoria)||'—'}</span></td><td>${info.tipo}</td><td class="mono">${BRL(info.valorTotal)}</td>
        <td class="mono">${info.parcelaAtualLabel}</td><td><span class="status-pill ${info.situacao==='Finalizada'?'st-green':(info.situacao==='Atrasada'?'st-red':'st-yellow')}">${info.situacao}</span></td>
        <td class="mono">${BRL(info.comprometimentoFuturo)}</td></tr>`).join('') : `<tr class="empty-row"><td colspan="9">Nenhuma compra encontrada com esses filtros.</td></tr>`}</tbody></table>`;
    }
    drawTodas();
    ['fcTipo','fcSituacao','fcCartao','fcCategoria'].forEach(idn=>document.getElementById(idn).addEventListener('change',drawTodas));
  }

  const head = document.createElement('div'); head.className='section-head'; head.innerHTML=`<h2>Cartões cadastrados</h2>`;
  const addBtn = document.createElement('button'); addBtn.className='btn btn-primary'; addBtn.textContent='+ Novo cartão';
  addBtn.onclick = ()=>cartaoForm(); head.appendChild(addBtn); main.appendChild(head);

  if(DB.cartoes.length===0){
    const e = document.createElement('div'); e.className='card'; e.innerHTML='<p style="color:var(--text-dim);font-size:13px;">Nenhum cartão cadastrado ainda.</p>';
    main.appendChild(e);
  }
  DB.cartoes.forEach(c=>{
    const fatura = cartaoFaturaAtual(c.id);
    const futuro = cartaoComprometimentoFuturo(c.id);
    const usado = cartaoLimiteUsado(c.id);
    const limite = parseNum(c.limite);
    const pctUso = limite>0? Math.min(100,(usado/limite)*100) : 0;
    const card = document.createElement('div'); card.className='card section';
    card.innerHTML = `<div class="section-head" style="margin-bottom:8px;"><h3 style="font-size:15px;">${esc(c.nome)} <span class="tag">${esc(c.banco)||'—'}</span></h3>
      <div class="row-actions"><button class="btn btn-sm btn-ghost" onclick="cartaoForm('${c.id}')">Editar</button><button class="btn btn-sm btn-danger" onclick="deleteCartao('${c.id}')">Excluir</button></div></div>
      <div class="grid grid-4" style="margin-bottom:10px;">
        ${kpiCard('Fatura atual', BRL(fatura))}${kpiCard('Comprometimento futuro', BRL(futuro))}${kpiCard('Limite', BRL(limite))}${kpiCard('Limite usado', pct(pctUso))}
      </div>
      <div class="progress" style="margin-bottom:14px;"><div style="width:${pctUso}%;background:${pctUso>85?'var(--red)':pctUso>60?'var(--orange)':'var(--green)'};"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:12.5px;color:var(--text-dim);">Fecha dia ${c.fechamento||'—'} · Vence dia ${c.vencimento||'—'}</span>
        <button class="btn btn-sm btn-primary" onclick="compraForm(null,'${c.id}')">+ Nova compra</button>
      </div>
      <div class="table-wrap" id="compras_${c.id}"></div>`;
    main.appendChild(card);
    const compras = DB.comprasCartao.filter(cp=>cp.cartaoId===c.id).sort((a,b)=>b.data.localeCompare(a.data));
    const w = card.querySelector(`#compras_${c.id}`);
    w.innerHTML = `<table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor total</th><th>Parcela</th><th>Situação</th><th>Restantes</th><th></th></tr></thead><tbody>
      ${compras.length? compras.map(cp=>{
        const info = compraCartaoInfo(cp);
        return `<tr><td>${fmtDate(cp.data)}</td><td>${esc(cp.descricao)}</td><td><span class="tag">${esc(cp.categoria)||'—'}</span></td><td>${info.tipo}</td>
        <td class="mono">${BRL(info.valorTotal)}</td><td class="mono">${BRL(info.valorParcela)} (${info.parcelaAtualLabel})</td>
        <td><span class="status-pill ${info.situacao==='Finalizada'?'st-green':(info.situacao==='Atrasada'?'st-red':'st-yellow')}">${info.situacao}</span></td>
        <td class="mono">${BRL(info.comprometimentoFuturo)}</td>
        <td><div class="row-actions"><button class="btn btn-sm btn-ghost" onclick="compraForm('${cp.id}','${c.id}')">Editar</button><button class="btn btn-sm btn-danger" onclick="deleteItem('comprasCartao','${cp.id}')">Excluir</button></div></td></tr>`;
      }).join('') : `<tr class="empty-row"><td colspan="9">Nenhuma compra registrada neste cartão.</td></tr>`}</tbody></table>`;
  });
}

// Média histórica de ENTRADAS BRUTAS EFETIVAMENTE RECEBIDAS (Entradas + Apps + Corretagem), usada para projeções
// coerentes com o motor de dízimo — substitui o uso isolado de rendaMediaMensal() apenas dentro do Fluxo de Caixa.
function rendaMediaBrutaTotalMensal(){
  const meses = new Set();
  DB.entradas.forEach(e=>{ if(e.recebido) meses.add(monthKey(e.dataRecebimento||e.data)); });
  DB.apps.forEach(a=>{ if(a.data) meses.add(monthKey(a.data)); });
  DB.corretagem.forEach(c=>{ if(parseNum(c.valorRecebido)>0) meses.add(monthKey(c.dataRecebimento||c.data)); });
  if(meses.size===0) return 0;
  let total=0;
  meses.forEach(mk=>{ total += totalEntradasBrutasRecebidasMes(mk); });
  return total/meses.size;
}

function renderFluxo(main){
  pageHeader(main, 'Fluxo de Caixa', 'Projeção do seu saldo ao longo dos próximos meses, com base nos dados cadastrados.');

  if(!parseNum(DB.config.saldoAtual) && DB.entradas.length===0){
    main.innerHTML += `<div class="missing-data">⚠️ Configure seu "Saldo atual" em Configurações para uma projeção mais precisa.</div>`;
  }

  const saldoInicial = parseNum(DB.config.saldoAtual);
  const horizontes = [0,1,2,3,6,12];
  let saldoAcumulado = saldoInicial;
  const linhas = [];
  const mediaBruta = rendaMediaBrutaTotalMensal();
  for(let i=0;i<=12;i++){
    const mk = addMonths(thisMonthKey()+'-01', i).slice(0,7);
    const realizado = i===0;
    // BRUTO -> DÍZIMO -> DISPONÍVEL (mês atual usa dados reais; meses futuros usam projeção coerente com Apps/Corretagem/Entradas)
    const bruto = realizado ? totalEntradasBrutasRecebidasMes(mk) : mediaBruta;
    const dizimo = realizado ? dizimoDoMes(mk) : round2(bruto * (dizimoPercentualAtivo()/100));
    const disponivel = round2(bruto - dizimo);
    const saidas = realizado ? valorComprometidoMes() : (despesasFixasMes()+despesasVariaveisMes()+ dividasParcelasProjetadas(i) + cartoesParcelasProjetadas(i) + parcelamentosProjetados(i));
    saldoAcumulado += (disponivel - saidas);
    linhas.push({mes:mk, bruto, dizimo, disponivel, saidas, saldo:saldoAcumulado, realizado});
  }

  const g = document.createElement('div'); g.className='grid grid-4 section';
  [0,1,3,6].forEach(h=>{
    const l = linhas[h];
    g.innerHTML += kpiCard(h===0?'Saldo projetado (este mês)':`Saldo projetado (+${h} meses)`, BRL(l.saldo), l.saldo<0?'neg':'pos');
  });
  main.appendChild(g);

  const negativo = linhas.find(l=>l.saldo<0);
  if(negativo){
    const idx = linhas.indexOf(negativo);
    const alerta = document.createElement('div'); alerta.className='missing-data'; alerta.style.background='var(--red-bg)'; alerta.style.borderColor='rgba(239,68,68,.4)'; alerta.style.color='#ffb4b4';
    alerta.innerHTML = `🚨 Seu saldo projetado ficará negativo em aproximadamente ${idx===0?'menos de 1 mês':`${idx} mês(es)`}, atingindo ${BRL(negativo.saldo)}.`;
    main.appendChild(alerta);
  }

  const wrap = document.createElement('div'); wrap.className='table-wrap section';
  wrap.innerHTML = `<table><thead><tr><th>Mês</th><th>Status</th><th>Entradas brutas</th><th>Dízimo</th><th>Disponível</th><th>Saídas</th><th>Saldo projetado</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td>${l.mes}</td><td><span class="status-pill ${l.realizado?'st-green':'st-purple'}">${l.realizado?'Realizado':'Projetado'}</span></td>
    <td class="mono pos">${BRL(l.bruto)}</td><td class="mono">${BRL(l.dizimo)}</td><td class="mono">${BRL(l.disponivel)}</td>
    <td class="mono neg">${BRL(l.saidas)}</td><td class="mono ${l.saldo<0?'neg':'pos'}">${BRL(l.saldo)}</td></tr>`).join('')}
  </tbody></table>`;
  main.appendChild(wrap);
  const note = document.createElement('p'); note.style.cssText='font-size:11.5px;color:var(--text-faint);margin-top:10px;';
  note.textContent = 'O mês atual usa dados efetivamente registrados (Realizado). Os meses seguintes são estimativas (Projetado), calculadas com base na média histórica de entradas brutas recebidas (Entradas + Apps + Corretagem) e nos compromissos fixos, de cartão e de dívidas com parcelas futuras. O dízimo projetado é apenas uma estimativa — não é registrado como pago.';
  main.appendChild(note);
}
function dividasParcelasProjetadas(mesesAFrente){
  return DB.dividas.reduce((s,d)=>{
    const restantes = Math.max(0,(parseInt(d.qtdParcelas)||0)-(parseInt(d.parcelasPagas)||0));
    return s + (mesesAFrente < restantes ? parseNum(d.valorParcela) : 0);
  },0);
}
function cartoesParcelasProjetadas(mesesAFrente){
  return DB.comprasCartao.reduce((s,c)=>{
    const info = compraCartaoInfo(c);
    const restantesNoFuturo = Math.max(0, info.parcelasRestantes - mesesAFrente);
    return s + (restantesNoFuturo>0 ? info.valorParcela : 0);
  },0);
}
function parcelamentosProjetados(mesesAFrente){
  return DB.despesas.filter(d=>d.parcelado).reduce((s,d)=>{
    const info = despesaParcelaInfo(d);
    const restantesNoFuturo = Math.max(0, info.parcelasRestantes - mesesAFrente);
    return s + (restantesNoFuturo>0 ? info.valorParcela : 0);
  },0);
}

function gerarTextoSituacao(comp){
  if(comp===0 && rendaMediaMensal()===0) return 'Cadastre suas receitas e despesas para que o consultor possa gerar um diagnóstico confiável.';
  if(comp<50) return `Seu comprometimento financeiro atual está em ${pct(comp)}, um nível saudável. Continue mantendo o controle e considere fortalecer sua reserva financeira.`;
  if(comp<70) return `Seu comprometimento financeiro atual está em ${pct(comp)}. Ainda é administrável, mas merece atenção antes que suba mais.`;
  if(comp<90) return `Seu comprometimento financeiro atual está em ${pct(comp)}, um nível elevado. Grande parte da sua renda está presa a compromissos fixos e dívidas.`;
  return `Seu comprometimento financeiro atual está em ${pct(comp)} e seu fluxo de caixa apresenta risco real de insuficiência. É hora de agir com prioridade máxima sobre as dívidas de maior impacto.`;
}
function gerarProblemas(){
  const problemas = [];
  const compCartoes = totalFaturasCartoesMes();
  if(compCartoes > rendaMediaMensal()*0.3 && compCartoes>0) problemas.push({titulo:'Cartões comprometidos', detalhe:`As faturas de cartão consomem ${BRL(compCartoes)}/mês, um valor elevado em relação à sua renda.`});
  const parcTotal = totalComprometimentoFuturoParcelamentos()+totalComprometimentoFuturoCartoes();
  if(parcTotal > rendaMediaMensal()) problemas.push({titulo:'Parcelamentos elevados', detalhe:`O comprometimento futuro com parcelamentos (${BRL(parcTotal)}) já supera sua renda mensal.`});
  const rv = totalRendaVariavelMes();
  if(DB.rendaVariavel.length>0 && rv < despesasVariaveisMes()) problemas.push({titulo:'Renda variável insuficiente', detalhe:'Sua renda variável do mês está abaixo das suas despesas variáveis.'});
  const atrasadas = DB.dividas.filter(d=>d.atrasada);
  if(atrasadas.length>0) problemas.push({titulo:'Dívidas em atraso', detalhe:`Você possui ${atrasadas.length} dívida(s) em atraso, o que aumenta o risco de negativação e juros adicionais.`});
  if(saldoDisponivelMes()<0) problemas.push({titulo:'Fluxo de caixa negativo', detalhe:`Suas saídas do mês superam suas entradas em ${BRL(Math.abs(saldoDisponivelMes()))}.`});
  return problemas;
}

    else if(METODO_ATUAL==='fluxo') ordenadas = dividas.slice().sort((a,b)=>parseNum(b.valorParcela)-parseNum(a.valorParcela));

    main.appendChild(rec);
  }
}
